name: GSC Index Submit (2.0)

on:
  schedule:
    # 每周二北京时间 10:00 (UTC 2:00)，避开周一报告高峰
    - cron: '0 2 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: "提交模式: core / optimized / all"
        required: false
        default: "core"
        type: choice
        options:
          - core
          - optimized
          - all

jobs:
  gsc-index-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-api-python-client python-dotenv PyYAML

      - name: Run GSC Index Submit
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'core' }}"
          echo "=== [2.0] GSC索引提交模式: $MODE ==="
          
          case "$MODE" in
            core)
              python scripts/gsc_index_submit.py --core
              ;;
            optimized)
              python scripts/gsc_index_submit.py --optimized
              ;;
            all)
              python scripts/gsc_index_submit.py --all
              ;;
          esac
          
          echo "=== [2.0] GSC索引提交完成 ==="

      - name: Commit GSC report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/gsc_index_report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无GSC报告变更"
          else
            git commit -m "chore: update GSC index submission report [skip ci]"
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; echo "rebase失败，跳过"; }
            git push || echo "推送失败，跳过"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-index-report
          path: reports/gsc_index_report.json
          retention-days: 30
