name: Yearly Feishu Report

on:
  schedule:
    # 每年1月1日北京时间08:00（UTC 0:00）
    - cron: '0 0 1 1 *'
  workflow_dispatch:

jobs:
  yearly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client

      - name: Run Feishu Yearly Report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python scripts/feishu_yearly_report.py

      - name: Commit OKR progress snapshot
        if: always()
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          git add reports/okr_progress/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无 OKR 快照变更"
          else
            git commit -m "chore: update OKR progress snapshot [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yearly-report-data
          path: reports/
          retention-days: 90
