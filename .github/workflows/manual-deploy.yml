name: Manual Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la public/ | head -20
          echo ""
          echo "=== Latest post ==="
          ls -la public/posts/ | head -10
          echo ""
          TOTAL=$(find public -type f | wc -l)
          echo "Total files in public/: $TOTAL"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '032a874de4e89298d9f492590b08ecba' }}
          command: pages deploy public --project-name=chinaboundtravel

      - name: Purge CDN Cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID="${{ vars.CLOUDFLARE_ZONE_ID }}"
          if [ -n "$ZONE_ID" ]; then
            echo "=== Purging CDN cache ==="
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | python3 -m json.tool 2>/dev/null || echo "Cache purge skipped"
          else
            echo "No ZONE_ID set, skipping cache purge"
          fi