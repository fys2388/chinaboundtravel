name: Manual Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la public/ | head -20
          echo ""
          echo "=== Latest post ==="
          ls -la public/posts/ | head -10

      - name: Deploy to Cloudflare Pages via Direct Upload
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Verifying credentials ==="
          echo "Account ID: ${CF_ACCOUNT:0:6}...(${#CF_ACCOUNT} chars)"
          echo "Token prefix: ${CF_TOKEN:0:10}...(${#CF_TOKEN} chars)"

          # Verify token validity
          echo ""
          echo "=== Verifying token ==="
          TOKEN_CHECK=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CF_TOKEN}")
          echo "$TOKEN_CHECK" | python3 -m json.tool 2>/dev/null || echo "$TOKEN_CHECK"

          echo ""
          echo "=== Deploying to Cloudflare Pages ==="
          cd public
          zip -r ../site.zip . -q
          echo "Site zip size: $(du -h ../site.zip | cut -f1)"
          cd ..

          PROJECT_NAME="chinaboundtravel"

          echo "Uploading to: accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}/deployments"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}/deployments" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "site=@site.zip" \
            --max-time 300)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            # Try to decode error
            ERROR_MSG=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('errors',[{}])[0].get('message','unknown'))" 2>/dev/null || echo "")
            if [ -n "$ERROR_MSG" ]; then
              echo "Error detail: $ERROR_MSG"
            fi
            exit 1
          fi

      - name: Purge CDN Cache
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID="${{ vars.CLOUDFLARE_ZONE_ID }}"
          if [ -n "$ZONE_ID" ]; then
            echo "=== Purging CDN cache ==="
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | python3 -m json.tool 2>/dev/null || echo "Cache purge skipped"
          else
            echo "No ZONE_ID set, skipping cache purge"
          fi