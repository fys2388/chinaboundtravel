name: Test Buffer API Connection
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of analytics to pull'
        required: false
        default: '7'

jobs:
  test-buffer-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Buffer API Tokens
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKEN_2: ${{ secrets.BUFFER_ACCESS_TOKEN_2 }}
        run: |
          echo "=== Buffer API Token 验证 ==="
          echo "BUFFER_ACCESS_TOKEN 长度: ${#BUFFER_ACCESS_TOKEN}"
          echo "BUFFER_ACCESS_TOKEN_2 长度: ${#BUFFER_ACCESS_TOKEN_2}"
          echo ""
          if [ -z "$BUFFER_ACCESS_TOKEN" ]; then
            echo "❌ BUFFER_ACCESS_TOKEN 未配置"
          else
            echo "✅ BUFFER_ACCESS_TOKEN 已配置 (长度: ${#BUFFER_ACCESS_TOKEN})"
          fi
          if [ -z "$BUFFER_ACCESS_TOKEN_2" ]; then
            echo "❌ BUFFER_ACCESS_TOKEN_2 未配置"
          else
            echo "✅ BUFFER_ACCESS_TOKEN_2 已配置 (长度: ${#BUFFER_ACCESS_TOKEN_2})"
          fi
          echo ""
          echo "=== 运行 social_analytics_pull.py --validate ==="
          python scripts/social_analytics_pull.py --validate || echo "验证失败"

      - name: Pull Social Analytics (Test)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKEN_2: ${{ secrets.BUFFER_ACCESS_TOKEN_2 }}
        run: |
          echo "=== 拉取社媒分析数据 (测试) ==="
          python scripts/social_analytics_pull.py --days ${{ github.event.inputs.days }} --dry-run || echo "拉取失败"

      - name: Check Generated Data
        run: |
          echo "=== 检查生成的数据文件 ==="
          ls -la data/social/ 2>/dev/null || echo "data/social/ 目录不存在或为空"
          echo ""
          ls -la reports/measurement/ 2>/dev/null || echo "reports/measurement/ 目录不存在"
          echo ""
          if [ -f reports/measurement/current_metrics.json ]; then
            echo "=== current_metrics.json 社媒部分 ==="
            python -c "import json; d=json.load(open('reports/measurement/current_metrics.json')); print(json.dumps(d.get('social',{}), indent=2))"
          fi
