name: 内容生产流水线（旧版，保留巡检功能）

on:
  schedule:
    # 【仅保留巡检】每日巡检1次，博文生成由 weekly-blog-update.yml 处理
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: '执行操作'
        required: true
        default: 'daily-inspection'
        type: choice
        options:
          - run-pipeline
          - daily-inspection
          - add-topic

permissions:
  contents: write

jobs:
  # ==================== 内容生产流水线（已迁移到 weekly-blog-update.yml）====================
  content-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.event.inputs.action == 'run-pipeline')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run content pipeline
        run: python content_pipeline.py --run
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Commit generated post
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generated post $(date '+%Y-%m-%d')" && git push) || true

  # ==================== 凌晨全站巡检 ====================
  nightly-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event.schedule == '0 19 * * 5') || (github.event.inputs.action == 'daily-inspection')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run nightly inspection with error learning
        run: python daily_inspection.py --send-feishu --sync-external
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}

      - name: Commit inspection report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git add config/error_knowledge_base.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly inspection report $(date '+%Y-%m-%d')" && git push) || true

  # ==================== 发布到 Cloudflare Pages ====================
  deploy:
    runs-on: ubuntu-latest
    needs: [content-production]
    timeout-minutes: 15
    if: (github.event.schedule == '0 2 * * 1') || (github.event.schedule == '0 2 * * 2') || (github.event.schedule == '0 2 * * 3') || (github.event.schedule == '0 2 * * 4') || (github.event.schedule == '0 2 * * 5') || (github.event.inputs.action == 'run-pipeline')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.121.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chinaboundtravel
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}