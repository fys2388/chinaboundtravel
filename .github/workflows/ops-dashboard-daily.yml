name: Ops Dashboard Daily Refresh

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 08:00 = 北京 16:00
  workflow_dispatch:

concurrency:
  group: ops-dashboard
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect dashboard data
        env:
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          BUFFER_API_TOKEN_A: ${{ secrets.BUFFER_API_TOKEN_A }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
        run: |
          python ops-dashboard/collect_data.py

      - name: Build dashboard HTML
        run: |
          python ops-dashboard/build.py

      - name: Copy to static and deploy
        run: |
          mkdir -p static/ops-dashboard
          cp ops-dashboard/index.html static/ops-dashboard/index.html
          git add static/ops-dashboard/index.html ops-dashboard/dashboard_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ops): auto-refresh dashboard $(date -u '+%Y-%m-%d')"
            git push origin main
            echo "Dashboard updated and pushed"
          fi
