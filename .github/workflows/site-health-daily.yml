name: Site Health Daily Check

on:
  schedule:
    - cron: '0 0 * * *'  # 北京时间早8:00 (UTC 00:00)
    - cron: '0 12 * * *'  # 北京时间晚8:00 (UTC 12:00)
  workflow_dispatch:
    inputs:
      no_fix:
        description: '只检查不修复'
        type: boolean
        default: false

jobs:
  site-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Kill Switch
        id: kill_switch
        run: |
          python -c "
          import json
          with open('config/ai_governance.json') as f:
              gov = json.load(f)
          if gov['kill_switch']['global_enabled']:
              print('KILL_SWITCH_ENABLED=true')
              print('::warning::Global kill switch enabled, skipping auto-fix')
          else:
              print('KILL_SWITCH_ENABLED=false')
          "

      - name: Run Site Health Check
        id: health_check
        run: |
          if [ "${{ github.event.inputs.no_fix }}" == "true" ]; then
            python scripts/site_health_agent.py --no-fix
          else
            python scripts/site_health_agent.py
          fi

      - name: Route Unresolved Issues
        if: success()
        run: |
          ISSUES_FILE="reports/daily_issues/site_health_issues_$(date +%Y-%m-%d).json"
          if [ -f "$ISSUES_FILE" ]; then
            echo "Found unresolved issues, routing to agents..."
            python scripts/daily_issue_router.py --source site_health || true
          else
            echo "No unresolved issues from Site Health Agent"
          fi

      - name: Commit Auto-Fixes
        if: success()
        run: |
          git config --local user.email "ai-agent@chinaboundtravel.com"
          git config --local user.name "Site Health Agent"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(site-health): auto-fix by Site Health Agent [skip ci]"
            git push
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: reports/site_health/
          retention-days: 30
