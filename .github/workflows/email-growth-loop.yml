name: Email Growth Loop (Closed Loop 4)

on:
  schedule:
    # Every Thursday at 02:00 UTC (10:00 Beijing time)
    - cron: '0 2 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        type: boolean
        default: false
      days:
        description: 'Lookback days'
        type: number
        default: 7

concurrency:
  group: email-growth-loop
  cancel-in-progress: false

jobs:
  email-tracker:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # needed to commit report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-httplib2 google-analytics-data pandas

      - name: Write GA4 service account key
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > gsc-service-account-key.json
          echo "Service account key written"

      - name: Run Email Sequence Tracker
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: gsc-service-account-key.json
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          DAYS="${{ github.event.inputs.days }}"
          python scripts/email_sequence_tracker.py $DRY_RUN_FLAG --days "${DAYS:-7}"

      - name: Commit report
        if: always()
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          git add reports/email-marketing-report-*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: weekly email marketing report [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-marketing-report
          path: reports/email-marketing-report-*.md
          retention-days: 30
