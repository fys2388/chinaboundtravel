name: Cross-Agent Learning Weekly

# 周度跨Agent学习工作流
# 每周一UTC 00:00自动运行
# 流程: 真实数据拉取 -> 6大Agent学习闭环 -> 跨Agent协同学习 -> 协同机制 -> Measure验证 -> 提交

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  cross-agent-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "Using default packages"


      - name: AI Governance Check (Kill Switch)
        run: |
          echo "=== AI Governance Check ==="
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from ai_governance import check_kill_switch
          is_safe, reason = check_kill_switch()
          if not is_safe:
              print(f'KILL SWITCH ACTIVE: {reason}')
              print('Cross-Agent Learning blocked by Kill Switch.')
              sys.exit(1)
          print('Kill Switch: OK (not active)')
          "

      - name: Step 1 - Pull real data (GA4/GSC/Social/Content)
        id: real_data
        run: |
          echo "=== Step 1: 拉取真实数据 ==="
          python scripts/real_data_pull_engine.py --all || echo "Real data pull completed (some sources may use cache)"
          echo "data_pull_status=completed" >> $GITHUB_OUTPUT

      - name: Step 2 - Run Social Learning Closed Loop
        run: |
          echo "=== Step 2: Social Learning 闭环 ==="
          python scripts/social_learning_closed_loop.py --run || echo "Social Learning completed"
        continue-on-error: true

      - name: Step 3 - Run Content Learning Closed Loop
        run: |
          echo "=== Step 3: Content Learning 闭环 ==="
          python scripts/content_learning_closed_loop.py --run || echo "Content Learning completed"
        continue-on-error: true

      - name: Step 4 - Run Conversion Learning Closed Loop
        run: |
          echo "=== Step 4: Conversion Learning 闭环 ==="
          python scripts/conversion_learning_closed_loop.py --run || echo "Conversion Learning completed"
        continue-on-error: true

      - name: Step 5 - Run SEO Learning Closed Loop
        run: |
          echo "=== Step 5: SEO Learning 闭环 ==="
          python scripts/seo_learning_closed_loop.py --run || echo "SEO Learning completed"
        continue-on-error: true

      - name: Step 6 - Run User Learning Closed Loop
        run: |
          echo "=== Step 6: User Learning 闭环 ==="
          python scripts/user_learning_closed_loop.py --run || echo "User Learning completed"
        continue-on-error: true

      - name: Step 7 - Run Revenue Learning Closed Loop
        run: |
          echo "=== Step 7: Revenue Learning 闭环 ==="
          python scripts/revenue_learning_closed_loop.py --run || echo "Revenue Learning completed"
        continue-on-error: true

      - name: Step 8 - Run Cross-Agent Learning Orchestrator
        run: |
          echo "=== Step 8: 跨Agent协同学习编排器 ==="
          python scripts/cross_agent_learning_orchestrator.py --run-all || echo "Cross-agent orchestrator completed"
        continue-on-error: true

      - name: Step 9 - Run SYN-001 Content-Social Synergy
        run: |
          echo "=== Step 9: SYN-001 内容-社媒协同 ==="
          python scripts/synergy_content_social.py --run || echo "SYN-001 completed"
        continue-on-error: true

      - name: Step 10 - Run SYN-003 Revenue-Conversion Synergy
        run: |
          echo "=== Step 10: SYN-003 收入-转化协同 ==="
          python scripts/synergy_revenue_conversion.py --run || echo "SYN-003 completed"
        continue-on-error: true

      - name: Step 11 - Measure validation (before/after comparison)
        id: measure
        run: |
          echo "=== Step 11: Measure验证（前后对照） ==="
          python scripts/measure_validation_engine.py --run || echo "Measure validation completed"
          echo "measure_status=completed" >> $GITHUB_OUTPUT

      - name: Step 12 - Update Growth Memory
        run: |
          echo "=== Step 12: 更新 Growth Memory ==="
          python scripts/growth_memory_updater.py --run || echo "Growth Memory updated"
        continue-on-error: true

      - name: Step 13 - Generate Learning Summary
        id: summary
        run: |
          echo "=== Step 13: 生成本周学习总结 ==="
          echo "learning_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

          # 统计策略文件是否更新
          for agent in social content conversion seo user revenue; do
            FILE="reports/${agent}/${agent}_optimization_strategy.json"
            if [ -f "$FILE" ]; then
              echo "${agent}_strategy=yes" >> $GITHUB_OUTPUT
            else
              echo "${agent}_strategy=no" >> $GITHUB_OUTPUT
            fi
          done

          # 统计Measure验证结果
          MEASURE_FILE="reports/measurement/measure_validation_report.json"
          if [ -f "$MEASURE_FILE" ]; then
            MEASURE_SCORE=$(python -c "import json; d=json.load(open('$MEASURE_FILE')); print(d.get('overall_score', 0))" 2>/dev/null || echo "0")
            echo "measure_score=$MEASURE_SCORE" >> $GITHUB_OUTPUT
          else
            echo "measure_score=0" >> $GITHUB_OUTPUT
          fi

      - name: Step 14 - Commit learning results
        run: |
          echo "=== Step 14: 提交学习结果 ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/social/ reports/content/ reports/conversion/ reports/seo/ reports/user/ reports/revenue/ reports/cross_agent/ reports/synergy/ reports/growth_memory/ reports/measurement/ reports/real_data/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No learning changes to commit"
          else
            COMMIT_MSG="feat(ai-learning): weekly cross-agent learning update $(date +%Y-%m-%d)"
            COMMIT_MSG="$COMMIT_MSG - 6 agent loops + cross-agent orchestrator + SYN-001/SYN-003 + measure validation"
            git commit -m "$COMMIT_MSG"
            # Push with retry to handle transient ref-lock contention
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "push ok (attempt $i)"
                break
              fi
              echo "push failed (attempt $i), rebase and retry in $((i * 15))s..."
              sleep $((i * 15))
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            done
            git ls-remote --exit-code origin main >/dev/null 2>&1 || { echo "::error::push 失败"; exit 1; }
            echo "Learning results committed and pushed"
          fi

      - name: Step 15 - Send Feishu notification
        if: always()
        run: |
          echo "=== Step 15: 发送飞书通知 ==="
          if [ -n "${{ secrets.FEISHU_WEBHOOK_URL }}" ]; then
            python scripts/send_feishu_notification.py \
              --title "Weekly Cross-Agent Learning Complete $(date +%Y-%m-%d)" \
              --message "6 agent loops + cross-agent orchestrator + SYN-001/SYN-003 + measure validation completed. Measure score: ${{ steps.summary.outputs.measure_score }}/100" \
              --webhook "${{ secrets.FEISHU_WEBHOOK_URL }}" || echo "Feishu notification failed"
          else
            echo "FEISHU_WEBHOOK_URL not configured"
          fi
        continue-on-error: true

      - name: Step 16 - Show learning summary
        run: |
          echo "=========================================="
          echo "  Weekly Cross-Agent Learning Summary"
          echo "=========================================="
          echo "Date: ${{ steps.summary.outputs.learning_date }}"
          echo "Data pull: ${{ steps.real_data.outputs.data_pull_status }}"
          echo "Measure score: ${{ steps.summary.outputs.measure_score }}/100"
          echo ""
          echo "6 Agent Learning Loops:"
          echo "  - Social: ${{ steps.summary.outputs.social_strategy }}"
          echo "  - Content: ${{ steps.summary.outputs.content_strategy }}"
          echo "  - Conversion: ${{ steps.summary.outputs.conversion_strategy }}"
          echo "  - SEO: ${{ steps.summary.outputs.seo_strategy }}"
          echo "  - User: ${{ steps.summary.outputs.user_strategy }}"
          echo "  - Revenue: ${{ steps.summary.outputs.revenue_strategy }}"
          echo ""
          echo "All learning results committed to GitHub"
          echo "=========================================="
