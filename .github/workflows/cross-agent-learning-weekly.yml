name: Cross-Agent Learning Weekly

# 周度跨Agent学习工作流
# 每周一UTC 00:00自动运行
# 流程: 真实数据拉取 -> 6大Agent学习闭环 -> 跨Agent协同学习 -> 协同机制 -> Measure验证 -> 提交

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  cross-agent-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # GA4
      GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      # GSC
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      # Travelpayouts
      TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
      TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
      TRAVELPAYOUTS_DRIVE_ID: ${{ secrets.TRAVELPAYOUTS_DRIVE_ID }}
      # MailerLite
      MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
      # Buffer
      BUFFER_WORKER_URL: ${{ secrets.BUFFER_WORKER_URL }}
      NEW_BUFFER_WORKER_URL: ${{ secrets.NEW_BUFFER_WORKER_URL }}
      BUFFER_API_TOKEN_A: ${{ secrets.BUFFER_API_TOKEN_A }}
      BUFFER_API_TOKEN_B: ${{ secrets.BUFFER_API_TOKEN_B }}
      # Cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      # Feishu
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      # LLM - SenseNova
      SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
      LLM_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "Using default packages"


      - name: AI Governance Check (Kill Switch)
        run: |
          echo "=== AI Governance Check ==="
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from ai_governance import check_kill_switch
          is_safe, reason = check_kill_switch()
          if not is_safe:
              print(f'KILL SWITCH ACTIVE: {reason}')
              print('Cross-Agent Learning blocked by Kill Switch.')
              sys.exit(1)
          print('Kill Switch: OK (not active)')
          "

      - name: Step 1 - Pull real data (GA4/GSC/Social/Content)
        id: real_data
        run: |
          echo "=== Step 1: 拉取真实数据 ==="
          python scripts/real_data_pull_engine.py --all
          echo "data_pull_status=completed" >> $GITHUB_OUTPUT

      # P0 修复: 移除 6 个 Learning Closed Loop（与 6 个 core agent 100%职责重叠）
      # 策略文件由 core agent 内部通过 StrategyConsumer 消费，无需独立的 learning loop 生成

      - name: Step 2 - Run Cross-Agent Learning Orchestrator
        run: |
          echo "=== Step 2: 跨Agent协同学习编排器 ==="
          python scripts/cross_agent_learning_orchestrator.py --run-all
        continue-on-error: true

      - name: Step 3 - Run SYN-001 Content-Social Synergy
        run: |
          echo "=== Step 3: SYN-001 内容-社媒协同 ==="
          python scripts/synergy_content_social.py --run
        continue-on-error: true

      - name: Step 4 - Run SYN-003 Revenue-Conversion Synergy
        run: |
          echo "=== Step 4: SYN-003 收入-转化协同 ==="
          python scripts/synergy_revenue_conversion.py --run
        continue-on-error: true

      - name: Step 5 - Measure validation (before/after comparison)
        id: measure
        run: |
          echo "=== Step 5: Measure验证（前后对照） ==="
          python scripts/measure_validation_engine.py --run
          echo "measure_status=completed" >> $GITHUB_OUTPUT

      - name: Step 6 - Update Growth Memory
        run: |
          echo "=== Step 6: 更新 Growth Memory ==="
          python scripts/growth_memory_updater.py --run
        continue-on-error: true

      - name: Step 7 - Generate Learning Summary
        id: summary
        run: |
          echo "=== Step 7: 生成本周学习总结 ==="
          echo "learning_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

          # 统计Measure验证结果
          MEASURE_FILE="reports/measurement/measure_validation_report.json"
          if [ -f "$MEASURE_FILE" ]; then
            MEASURE_SCORE=$(python -c "import json; d=json.load(open('$MEASURE_FILE')); print(d.get('overall_score', 0))" 2>/dev/null || echo "0")
            echo "measure_score=$MEASURE_SCORE" >> $GITHUB_OUTPUT
          else
            echo "measure_score=0" >> $GITHUB_OUTPUT
          fi

      - name: Step 8 - Commit learning results
        run: |
          echo "=== Step 8: 提交学习结果 ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/social/ reports/content/ reports/conversion/ reports/seo/ reports/user/ reports/revenue/ reports/cross_agent/ reports/synergy/ reports/growth_memory/ reports/measurement/ reports/real_data/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No learning changes to commit"
          else
            COMMIT_MSG="feat(ai-learning): weekly cross-agent learning update $(date +%Y-%m-%d)"
            COMMIT_MSG="$COMMIT_MSG - cross-agent orchestrator + SYN-001/SYN-003 + measure validation"
            git commit -m "$COMMIT_MSG"
            # Push with retry to handle transient ref-lock contention
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "push ok (attempt $i)"
                break
              fi
              echo "push failed (attempt $i), rebase and retry in $((i * 15))s..."
              sleep $((i * 15))
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            done
            git ls-remote --exit-code origin main >/dev/null 2>&1 || { echo "::error::push 失败"; exit 1; }
            echo "Learning results committed and pushed"
          fi

      - name: Step 9 - Send Feishu notification
        if: always()
        run: |
          echo "=== Step 9: 发送飞书通知 ==="
          if [ -n "${{ secrets.FEISHU_WEBHOOK_URL }}" ]; then
            python scripts/send_feishu_notification.py \
              --title "Weekly Cross-Agent Learning Complete $(date +%Y-%m-%d)" \
              --message "Cross-agent orchestrator + SYN-001/SYN-003 + measure validation completed. Measure score: ${{ steps.summary.outputs.measure_score }}/100" \
              --webhook "${{ secrets.FEISHU_WEBHOOK_URL }}" || echo "Feishu notification failed"
          else
            echo "FEISHU_WEBHOOK_URL not configured"
          fi
        continue-on-error: true

      - name: Step 10 - Show learning summary
        run: |
          echo "=========================================="
          echo "  Weekly Cross-Agent Learning Summary"
          echo "=========================================="
          echo "Date: ${{ steps.summary.outputs.learning_date }}"
          echo "Data pull: ${{ steps.real_data.outputs.data_pull_status }}"
          echo "Measure score: ${{ steps.summary.outputs.measure_score }}/100"
          echo ""
          echo "Architecture: 6 core agents (weekly) + cross-agent orchestrator + synergies + measure validation"
          echo "All learning results committed to GitHub"
          echo "=========================================="
