name: Weekly Feishu Report

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client

      - name: Run Agent Analysis
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          # Agent 先分析本周数据趋势，生成洞察
          python scripts/agent_runner.py --agent seo --goal "分析本周运营数据，识别趋势和异常，给出优化建议" --max-steps 8 || echo "Agent 分析失败，报告将不包含 AI 洞察"

      - name: Run Feishu Weekly Report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TRAVELPAYOUTS_DRIVE_ID: ${{ secrets.TRAVELPAYOUTS_DRIVE_ID }}
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
          NORDVPN_AFFILIATE_ID: ${{ secrets.NORDVPN_AFFILIATE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/feishu_weekly_report.py --with-agent-insights --agent-name seo


      - name: Commit OKR progress snapshot and Agent outputs
        if: always()
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          
          # 提交 Agent 洞察和记忆
          git add reports/agent/ 2>/dev/null || true
          
          # 提交 OKR 快照
          git add reports/okr_progress/ 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore: update OKR snapshot and Agent insights [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-data
          path: reports/
          retention-days: 30
