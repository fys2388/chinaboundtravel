name: Annual Content Review

on:
  schedule:
    - cron: '0 8 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate annual content review
        run: python chinaboundtravel_social_bot/scripts/annual_content_review.py

      - name: Build with Hugo
        run: hugo --minify

      - name: Commit and push with skip ci
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: annual content review" && git push) || true
