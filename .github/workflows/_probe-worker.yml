name: PROBE Worker (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe worker health
        env:
          BUFFER_WORKER_URL: ${{ secrets.BUFFER_WORKER_URL || 'https://buffer-auto-poster.fys2388.workers.dev/publish' }}
          NEW_BUFFER_WORKER_URL: ${{ secrets.NEW_BUFFER_WORKER_URL || 'https://buffer-auto-poster.fys2388.workers.dev/publish' }}
        run: |
          echo "--- health A ---"
          curl -sS --max-time 30 "$BUFFER_WORKER_URL" -X POST -H 'Content-Type: application/json' -d '{"title":"probe health A","desc":"probe","cover":"","custom_text":"probe","content_id":"probe-health-A","content_variant":"ig_probe","source_workflow":"codex_probe"}' | head -c 500
          echo ""
          echo "--- health B ---"
          curl -sS --max-time 30 "$NEW_BUFFER_WORKER_URL" -X POST -H 'Content-Type: application/json' -d '{"title":"probe health B","desc":"probe","cover":"","custom_text":"probe","content_id":"probe-health-B","content_variant":"ig_probe","source_workflow":"codex_probe"}' | head -c 500
          echo ""
