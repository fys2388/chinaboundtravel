name: Snapshot Daily Refresh (2.0 KPI)

on:
  schedule:
    - cron: '30 0 * * *'  # Daily 00:30 UTC — before Feishu daily report (01:00+)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect GSC page-level snapshot (index visibility baseline)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python scripts/gsc_index_snapshot.py || {
            echo "::warning::GSC 快照采集失败（引擎会保持 INSUFFICIENT_BASELINE，不阻塞）"
          }

      # 2026-09-22 (AUDIT-OPS-003)：在生成 REPORTING_SNAPSHOT 之前先刷一次
      # reports/real_data/gsc_real_data.json（query 级 28d GSC 数据）。
      # reporting_kpi_engine.build_seo_gsc() 从此文件读取 GSC query 级 KPI，
      # 而不是从冻结的 SEO_BASELINE_2026-08.md。这一步不阻塞主流程；如果
      # GSC 凭据有问题，reporting_kpi_engine 会退回 SEO_BASELINE 并标记 CACHED。
      - name: Refresh GSC real data (query-level 28d, feeds build_seo_gsc)
        id: gsc_real_data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from real_data_pull_engine import pull_gsc_data
          r = pull_gsc_data(days=28, save=True)
          print('status:', r.get('status'))
          print('data_date:', r.get('data_date'))
          print('impressions:', (r.get('metrics') or {}).get('impressions'))
          print('clicks:', (r.get('metrics') or {}).get('clicks'))
          " || {
            echo "::warning::GSC real-data 拉取失败（build_seo_gsc 将回退到 SEO_BASELINE_2026-08.md）"
          }

      - name: Regenerate 2.0 KPI snapshot
        run: |
          TODAY="$(date +%Y-%m-%d)"
          echo "as-of: $TODAY"
          python scripts/reporting_kpi_engine.py --as-of "$TODAY"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/management/REPORTING_SNAPSHOT.json reports/management/snapshots/ reports/seo/gsc_page_snapshots/ reports/real_data/gsc_real_data.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无待提交变更（数据未变化）"
          else
            git commit -m "chore: refresh 2.0 KPI snapshot $(date +%Y-%m-%d) [skip ci]"
          fi
          git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; echo "::error::rebase 失败"; exit 1; }
          # Push with retry to handle transient ref-lock contention (concurrent workflows)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push ok (attempt $i)"
              break
            fi
            echo "push failed (attempt $i), rebase and retry in $((i * 15))s..."
            sleep $((i * 15))
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
          done
          git ls-remote --exit-code origin main >/dev/null 2>&1 || { echo "::error::push 失败"; exit 1; }
