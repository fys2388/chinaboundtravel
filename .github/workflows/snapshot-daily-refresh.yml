name: Snapshot Daily Refresh (2.0 KPI)

on:
  schedule:
    - cron: '30 0 * * *'  # Daily 00:30 UTC — before Feishu daily report (01:00+)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate 2.0 KPI snapshot
        run: |
          TODAY="$(date +%Y-%m-%d)"
          echo "as-of: $TODAY"
          python scripts/reporting_kpi_engine.py --as-of "$TODAY"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/management/REPORTING_SNAPSHOT.json reports/management/snapshots/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无待提交变更（数据未变化）"
          else
            git commit -m "chore: refresh 2.0 KPI snapshot $(date +%Y-%m-%d) [skip ci]"
          fi
          git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; echo "::error::rebase 失败"; exit 1; }
          git push
