name: YouTube Auto Publish
on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday 3:00 UTC (11:00 Beijing)
  workflow_dispatch:
    inputs:
      article_slug:
        description: "Article slug to convert (leave empty for latest)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (generate video but don't upload)"
        required: false
        default: "false"
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install edge-tts requests
          sudo apt-get install -y ffmpeg
      - name: Generate and upload video
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        working-directory: chinaboundtravel_social_bot
        run: |
          echo "DEBUG: dry_run input = '${{ github.event.inputs.dry_run }}'"
          if [ -n "$YOUTUBE_CLIENT_SECRETS" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRETS" > youtube_client_secrets.json
          fi
          if [ -n "$YOUTUBE_OAUTH_REFRESH_TOKEN" ]; then
            printf '%s' "$YOUTUBE_OAUTH_REFRESH_TOKEN" > youtube_refresh_token.txt
          fi
          SLUG="${{ github.event.inputs.article_slug }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          echo "DEBUG: DRY = '$DRY', SLUG = '$SLUG'"
          if [ -n "$SLUG" ]; then
            python youtube_auto_upload.py --article "../content/posts/${SLUG}.md" $DRY 2>&1 | tee /tmp/pipeline_output.log
          else
            python youtube_auto_upload.py --latest $DRY 2>&1 | tee /tmp/pipeline_output.log
          fi
      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: /tmp/pipeline_output.log
          retention-days: 7