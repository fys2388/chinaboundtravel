name: Quarterly Feishu Report

on:
  schedule:
    # 每季度首月1日北京时间08:00（UTC 0:00）
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  quarterly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client

      - name: Run Agent Analysis
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python scripts/agent_runner.py --agent seo --goal "分析本季度运营数据，评估OKR进度，识别战略风险，给出下季度规划建议" --max-steps 12 || echo "Agent 分析失败"

      - name: Run Feishu Quarterly Report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python scripts/feishu_quarterly_report.py --with-agent-insights --agent-name seo

      - name: Commit OKR progress snapshot and Agent outputs
        if: always()
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          git add reports/agent/ 2>/dev/null || true
          git add reports/okr_progress/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更需要提交"
          else
            git commit -m "chore: update OKR snapshot and Agent insights [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-report-data
          path: reports/
          retention-days: 90
