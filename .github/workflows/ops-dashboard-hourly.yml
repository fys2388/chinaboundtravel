name: Ops Dashboard Refresh

on:
  schedule:
    - cron: '*/30 1-18 * * *'
  workflow_dispatch:

concurrency:
  group: ops-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv google-auth

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge quality reports
        run: |
          python scripts/merge_quality_issues.py
          python scripts/dispatch_quality_issues.py || true
          python scripts/agent_task_executor.py --date "$(date -u +%F)" || true

      - name: Collect dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          BUFFER_API_TOKEN_A: ${{ secrets.BUFFER_API_TOKEN_A }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
        run: |
          python ops-dashboard/collect_data.py

      - name: Build dashboard HTML
        run: |
          python ops-dashboard/build.py

      - name: Inject time range selector
        run: |
          python ops-dashboard/inject_range_selector.py

      - name: Push and trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p static/ops-dashboard
          cp ops-dashboard/index.html static/ops-dashboard/index.html
          cp ops-dashboard/dashboard_data.json static/ops-dashboard/dashboard_data.json
          # 同步 /ops/ 目录：
          #   ops-center.html 是手工维护的「统一运营中心」（看板/监控/考核/成长/营收/KPI 全量版），
          #   必须从本目录原样同步，绝不能用 build.py 的生成版覆盖它。
          #   2026-09-13 的 3a92c477 曾在这里 cp index.html 覆盖 ops-center.html，
          #   之后每 30 分钟刷新一次 = 统一中心被持续刷回精简监控页。
          #   js/echarts.min.js 是统一中心的图表依赖（HTML 里写死 ./js/echarts.min.js），
          #   此前从未发布到 /ops/，导致恢复后所有图表 404。
          mkdir -p static/ops static/ops/js
          cp ops-dashboard/ops-center.html static/ops/ops-center.html
          cp ops-dashboard/dashboard_data.json static/ops/dashboard_data.json
          cp ops-dashboard/js/echarts.min.js static/ops/js/echarts.min.js
          git add static/ops-dashboard/index.html static/ops-dashboard/dashboard_data.json ops-dashboard/dashboard_data.json static/ops/ops-center.html static/ops/dashboard_data.json static/ops/js/echarts.min.js reports/daily_issues/agent_tasks reports/daily_issues/execution_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ops): auto-refresh dashboard $(date -u '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "Dashboard updated and pushed"
            sleep 2
            gh workflow run "Post-deploy Tasks" || echo "Deploy trigger failed (non-fatal)"
            echo "Deploy workflow triggered"
          fi

