name: Affiliate CTA Optimization (Closed Loop 3)

on:
  schedule:
    # Every Wednesday at 02:00 UTC (10:00 Beijing time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no file modifications)'
        type: boolean
        default: true
      max_adjustments:
        description: 'Max CTA adjustments per run'
        type: number
        default: 10

concurrency:
  group: affiliate-optimize
  cancel-in-progress: false

jobs:
  affiliate-optimize:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth google-auth-httplib2 google-analytics-data pandas

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Write GA4 service account key
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > gsc-service-account-key.json
          echo "Service account key written"

      - name: Run Affiliate A/B Tester
        env:
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: gsc-service-account-key.json
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs are live (apply adjustments); manual dispatch defaults to dry-run
            if [ "${{ github.event_name }}" = "schedule" ]; then
              DRY_RUN_FLAG=""
            else
              DRY_RUN_FLAG="--dry-run"
            fi
          fi
          MAX_ADJ="${{ github.event.inputs.max_adjustments }}"
          python scripts/affiliate_ab_tester.py $DRY_RUN_FLAG --max-adjustments "${MAX_ADJ:-10}"

      - name: Verify Hugo build
        if: github.event_name == 'schedule'
        run: |
          hugo --quiet --minify -d public_affiliate_test
          echo "Hugo build verification passed"

      - name: Commit and push changes
        if: github.event_name == 'schedule'
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          git add reports/affiliate-ab-test-*.md reports/affiliate-learning-library.json content/posts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: affiliate CTA A/B optimization [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-ab-test-report
          path: |
            reports/affiliate-ab-test-*.md
            reports/affiliate-learning-library.json
          retention-days: 30
