name: Quality Monitor (6-hour)

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: quality-monitor
  cancel-in-progress: false

jobs:
  quality-monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run online semantic and SEO audit
        run: |
          python scripts/site_quality_audit.py \
            --base-url https://www.chinaboundtravel.com \
            --timeout 20 \
            --workers 8

      - name: Run production browser audit
        run: |
          python scripts/site_visual_audit.py \
            --base-url https://www.chinaboundtravel.com \
            --max-pages 10 \
            --timeout 30

      - name: Merge quality issues
        run: |
          python scripts/merge_quality_issues.py

      - name: Evaluate release risk
        id: evaluate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/quality/quality_issues.json").read_text(encoding="utf-8")
          )
          summary = report["summary"]
          print(
              f"quality gate: total={summary['total']} "
              f"P0={summary['P0']} P1={summary['P1']} P2={summary['P2']}"
          )
          if summary["P0"] or summary["P1"]:
              raise SystemExit(1)
          PY

      - name: Send Feishu alert
        if: steps.evaluate.outcome == 'failure'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL is not configured"
            exit 0
          fi
          python - <<'PY' >/tmp/cbt-quality-alert.json
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/quality/quality_issues.json").read_text(encoding="utf-8")
          )
          summary = report["summary"]
          issues = report.get("issues", [])[:8]
          lines = [
              "ChinaBound 网站质量告警",
              (
                  f"P0={summary['P0']} P1={summary['P1']} "
                  f"P2={summary['P2']} 总计={summary['total']}"
              ),
          ]
          for issue in issues:
              lines.append(
                  f"[{issue['severity']}] {issue.get('page', '')} "
                  f"{issue.get('title') or issue.get('type', 'issue')}"
              )
          print(
              json.dumps(
                  {
                      "msg_type": "text",
                      "content": {"text": "\n".join(lines)},
                  },
                  ensure_ascii=False,
              )
          )
          PY
          curl -sS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cbt-quality-alert.json

      - name: Commit quality reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/quality/
          if git diff --cached --quiet; then
            echo "No quality report changes"
            exit 0
          fi
          git commit -m "chore(quality): refresh website audit reports [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-monitor-reports
          path: reports/quality/
          retention-days: 30
