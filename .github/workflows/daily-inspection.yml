name: Daily Inspection & Auto-Update

on:
  schedule:
    # 每天北京时间 09:30 (UTC 01:30) 运行巡检
    - cron: '30 1 * * *'
    # 每周日北京时间 20:00 (UTC 12:00) 运行周报
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  daily-inspection:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 1 * * *'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run daily inspection
        run: python boundtravel_daily_inspector.py
        env:
          INSPECTION_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Commit inspection report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily inspection report $(date '+%Y-%m-%d')"
          git push

  weekly-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 12 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Generate weekly report
        run: |
          echo "Weekly report generation..."
          # Add your weekly report logic here

      - name: Commit weekly report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Weekly report $(date '+%Y-W%V')"
          git push
