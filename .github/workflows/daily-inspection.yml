name: 全站巡检+周报汇总

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      auto_fix:
        description: '启用自动修复'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  daily-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run auto-fix first
        if: github.event.inputs.auto_fix == 'true' || github.event.schedule == '0 1 * * *'
        run: python daily_inspection.py --auto-fix

      - name: Run daily inspection with Feishu notification
        run: python daily_inspection.py --send-feishu --sync-external
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}

      - name: Commit fixed files (triggers deployment)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add config/error_knowledge_base.json 2>/dev/null || true
          git add reports/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-fix + daily inspection $(date '+%Y-%m-%d')" && git push) || true

  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 12 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run weekly report with full audit
        run: python daily_inspection.py --weekly-report --send-feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

      - name: Commit weekly report (triggers deployment)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: weekly report $(date '+%Y-W%V')" && git push) || true

  # ========== 失败告警 ==========
  failure-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [daily-inspection, weekly-report]
    if: failure()
    steps:
      - name: Send failure notification to Feishu
        run: |
          echo "工作流执行失败，发送飞书通知..."
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ 工作流执行失败\n仓库: chinaboundtravel\n工作流: 全站巡检+周报汇总\n时间: '"$(date '+%Y-%m-%d %H:%M:%S')"'\n请检查 GitHub Actions 日志。"
              }
            }' || echo "飞书通知发送失败，跳过"