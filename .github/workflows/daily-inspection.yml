name: 全站巡检+周报汇总

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter python-dotenv
          pip list

      - name: Debug info - Environment
        run: |
          echo "=== Environment Info ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.head_ref || github.ref_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "=== Python Version ==="
          python --version
          echo "=== Script Arguments ==="
          python daily_inspection.py --help

      - name: Run auto-fix first
        id: auto-fix
        continue-on-error: true
        run: |
          echo "=== Starting auto-fix ==="
          python daily_inspection.py --auto-fix
          echo "=== Auto-fix completed ==="

      - name: Run daily inspection with full logging
        id: inspection
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
        run: |
          echo "=== Starting daily inspection ==="
          echo "FEISHU_WEBHOOK_URL is set: $([ -n "$FEISHU_WEBHOOK_URL" ] && echo "YES" || echo "NO")"
          echo "FEISHU_SECRET is set: $([ -n "$FEISHU_SECRET" ] && echo "YES" || echo "NO")"
          python daily_inspection.py --send-feishu --sync-external
          echo "=== Inspection completed ==="

      - name: Capture inspection output
        if: failure() || steps.inspection.outcome != 'success'
        run: |
          echo "=== Inspection failed with exit code: $INSPECTION_EXIT_CODE ==="
          ls -la reports/ 2>/dev/null || echo "Reports directory not found"
          cat reports/01_daily_inspection/*.md 2>/dev/null || echo "No report generated"

      - name: Commit fixed files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add config/error_knowledge_base.json 2>/dev/null || true
          git add reports/ 2>/dev/null || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: daily inspection $(date '+%Y-%m-%d')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi

  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(github.event.schedule, '0 12 * * 0')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter python-dotenv

      - name: Run weekly report with full logging
        id: weekly
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
        run: |
          echo "=== Starting weekly report ==="
          python daily_inspection.py --weekly-report --send-feishu
          echo "=== Weekly report completed ==="

      - name: Commit weekly report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ 2>/dev/null || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: weekly report $(date '+%Y-W%V')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi

  failure-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [daily-inspection, weekly-report]
    if: always() && (needs.daily-inspection.result == 'failure' || needs.weekly-report.result == 'failure')
    steps:
      - name: Send failure notification to Feishu
        run: |
          echo "工作流执行失败，发送飞书通知..."
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ 工作流执行失败\n仓库: chinaboundtravel\n工作流: 全站巡检+周报汇总\n时间: '"$(date '+%Y-%m-%d %H:%M:%S')"'\nRun ID: '"${{ github.run_id }}"'\\n请检查 GitHub Actions 日志: https://github.com/fys2388/chinaboundtravel/actions/runs/${{ github.run_id }}"
              }
            }' || echo "飞书通知发送失败，跳过"
