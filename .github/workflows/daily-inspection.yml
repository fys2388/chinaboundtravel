name: 全站巡检+周报汇总

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter python-dotenv

      - name: Debug info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Ref: ${{ github.ref }}"

      - name: Run daily inspection
        run: python daily_inspection.py --send-feishu --sync-external || true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_GA_KEY_JSON: ${{ secrets.GOOGLE_GA_KEY_JSON }}

      - name: Commit fixed files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add config/error_knowledge_base.json 2>/dev/null || true
          git add reports/ 2>/dev/null || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: auto-fix + daily inspection $(date '+%Y-%m-%d')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi

  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(github.event.schedule, '0 12 * * 0')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter python-dotenv

      - name: Run weekly report
        run: python daily_inspection.py --weekly-report --send-feishu || true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_GA_KEY_JSON: ${{ secrets.GOOGLE_GA_KEY_JSON }}

      - name: Commit weekly report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ 2>/dev/null || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: weekly report $(date '+%Y-W%V')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi

  failure-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [daily-inspection, weekly-report]
    if: always() && (needs.daily-inspection.result == 'failure' || needs.weekly-report.result == 'failure')
    steps:
      - name: Send failure notification to Feishu
        run: |
          echo "工作流执行失败，发送飞书通知..."
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ 工作流执行失败\n仓库: chinaboundtravel\n工作流: 全站巡检+周报汇总\n时间: '"$(date '+%Y-%m-%d %H:%M:%S')"'\n请检查 GitHub Actions 日志。"
              }
            }' || echo "飞书通知发送失败，跳过"
