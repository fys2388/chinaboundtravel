name: 全站巡检+周报汇总

on:
  schedule:
    # UTC 01:00 = 北京时间09:00 每日巡检
    - cron: '0 1 * * *'
    # UTC 12:00 = 北京时间20:00 每周日周报
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run daily inspection with Feishu notification
        run: python daily_inspection.py --send-feishu --sync-external
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}

      - name: Commit inspection report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "[skip ci] Daily inspection report $(date '+%Y-%m-%d')" && git push) || true

  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 12 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-frontmatter

      - name: Run weekly report with full audit
        run: python daily_inspection.py --weekly-report --send-feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

      - name: Commit weekly report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "[skip ci] Weekly report $(date '+%Y-W%V')" && git push) || true