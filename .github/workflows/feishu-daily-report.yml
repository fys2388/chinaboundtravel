name: Feishu Daily Report

on:
  schedule:
    # 每日早9点（北京时间 = UTC+8，所以UTC时间是1点）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client
          
      - name: Run Feishu Daily Report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
          NORDVPN_AFFILIATE_ID: ${{ secrets.NORDVPN_AFFILIATE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/feishu_daily_report.py
          
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-daily-report
          path: reports/feishu_daily/
          retention-days: 30
