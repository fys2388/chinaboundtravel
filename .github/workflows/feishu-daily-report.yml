name: Feishu Daily Report

on:
  schedule:
    # 主推送：北京时间 08:30 (UTC 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client

      - name: Check if report already sent today
        id: check-duplicate
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          REPORT_FILE="reports/feishu_daily/daily_${TODAY}.json"
          if [ -f "$REPORT_FILE" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ 今日日报已发送，跳过本次触发"
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
            echo "✅ 今日日报未发送，继续执行"
          fi

      - name: Run Feishu Daily Report
        id: send_report
        continue-on-error: true
        if: steps.check-duplicate.outputs.report_exists == 'false'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
          NORDVPN_AFFILIATE_ID: ${{ secrets.NORDVPN_AFFILIATE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/feishu_daily_report.py

      - name: Failure Auto-Diagnosis
        if: steps.send_report.outcome == 'failure'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          echo "=== 日报发送失败，自动诊断 ==="
          echo "FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:+configured}"
          echo "GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:+configured}"
          echo "GSC_SITE_URL: ${GSC_SITE_URL:+configured}"
          curl -s -o /dev/null -w "feishu_webhook_http: %{http_code}\n" "${FEISHU_WEBHOOK_URL}" || echo "feishu_webhook: unreachable"
          echo "=== 诊断完成，retry-failed.yml 将在 5 分钟后自动重跑本工作流补发 ==="
      - name: Commit OKR progress snapshot
        if: steps.send_report.outcome == 'success'
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          # reports/feishu_daily/ 是日报原始 JSON（daily_YYYY-MM-DD.json），必须入库，
          # 否则无历史可回溯，且 check-duplicate 的去重闸门永远读不到文件。
          git add reports/okr_progress/ reports/feishu_daily/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无 OKR 快照变更"
          else
            git commit -m "chore: update OKR progress snapshot [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-daily-report
          path: reports/feishu_daily/
          retention-days: 30

      - name: Fail job if report step failed
        # send_report 开了 continue-on-error，好让 Failure Auto-Diagnosis / artifact 步骤继续跑；
        # 但那样 job 结论仍是 success，retry-failed.yml 不会重跑。这里把失败重新抛回 job 结论。
        if: steps.send_report.outcome == 'failure'
        run: exit 1
