name: Feishu Daily Report

on:
  schedule:
    # 主触发：北京时间 09:00 (UTC 01:00)
    - cron: '0 1 * * *'
    # 备用触发1：北京时间 09:30 (UTC 01:30)
    - cron: '30 1 * * *'
    # 备用触发2：北京时间 10:00 (UTC 02:00)
    - cron: '0 2 * * *'
    # 备用触发3：北京时间 10:30 (UTC 02:30)
    - cron: '30 2 * * *'
    # 额外备用：北京时间 11:00 (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-api-python-client

      - name: Check if report already sent today
        id: check-duplicate
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          REPORT_FILE="reports/feishu_daily/daily_${TODAY}.json"
          if [ -f "$REPORT_FILE" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ 今日日报已发送，跳过本次触发"
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
            echo "✅ 今日日报未发送，继续执行"
          fi

      - name: Run Feishu Daily Report
        if: steps.check-duplicate.outputs.report_exists == 'false'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          NORDVPN_API_KEY: ${{ secrets.NORDVPN_API_KEY }}
          NORDVPN_AFFILIATE_ID: ${{ secrets.NORDVPN_AFFILIATE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/feishu_daily_report.py

      - name: Commit OKR progress snapshot
        if: always()
        run: |
          git config user.name "chinabound-bot"
          git config user.email "bot@chinaboundtravel.com"
          git add reports/okr_progress/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无 OKR 快照变更"
          else
            git commit -m "chore: update OKR progress snapshot [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-daily-report
          path: reports/feishu_daily/
          retention-days: 30
