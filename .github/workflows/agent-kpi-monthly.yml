name: Agent KPI Monthly Audit (营收导向考核)

on:
  schedule:
    # 每月1日北京时间 10:00 (UTC 2:00) 自动运行月度考核
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: "考核月份 (YYYY-MM，默认当前月)"
        required: false
        default: ""
        type: string
      notify:
        description: "是否发送飞书通知"
        required: false
        default: "false"
        type: boolean

jobs:
  agent-kpi-audit:
    runs-on: ubuntu-latest
    # 15 分钟不够：营收采集(GA4/Stripe/Travelpayouts 网络调用) + KPI 考核(多源)会耗尽配额，
    # 导致后面的 Generate Agent Growth Data 步骤根本执行不到。
    # 实证：2026-10-01 提交 76f57b33 只含 4 个 KPI 文件、零 growth 文件，
    # 而 export_growth_dashboard 每次写新 updated_at → growth 步骤那次确实没跑。
    # ops-dashboard/agent_growth_data.json 因此自 09-17 起停摆 31 天。
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # revenue_data_collector 需要 stripe / google-analytics-data / google-auth，
          # 之前只装 requests → 采集器里两个数据源直接 ImportError（"stripe 未安装" /
          # "google-analytics-data 未安装"），GA4 与 Stripe 营收在 CI 里恒为空。
          pip install requests stripe google-analytics-data google-auth

      - name: Run Agent KPI Audit (营收导向)
        id: kpi_audit
        run: |
          MONTH="${{ github.event.inputs.month || '' }}"
          
          # P0 修复: 先收集真实营收数据（GA4 + Stripe + Travelpayouts）
          # 之前缺失此步骤 → load_real_revenue_data() 从磁盘读取时无文件 → 营收恒为0
          echo "=== 收集营收数据 ==="
          python scripts/revenue_data_collector.py --source all --days 30 || echo "⚠️ Revenue collector failed (non-fatal, continuing with cache)"
          
          if [ -n "$MONTH" ]; then
            python scripts/agent_kpi_auditor.py --month "$MONTH" || KPI_EXIT=$?
          else
            python scripts/agent_kpi_auditor.py || KPI_EXIT=$?
          fi
          KPI_EXIT=${KPI_EXIT:-0}
          echo "kpi_exit=$KPI_EXIT" >> $GITHUB_OUTPUT

          # 读取考核结果摘要
          if [ -f ops-dashboard/agent_kpi_data.json ]; then
            echo "=== KPI 考核结果摘要 ==="
            python -c "
          import json
          with open('ops-dashboard/agent_kpi_data.json') as f:
              d = json.load(f)
          print(f'考核月份: {d[\"month\"]}')
          print(f'团队平均分: {d[\"avg_score\"]}/100')
          print()
          for a in d['agents']:
              icon = {'S':'🏆','A':'🥇','B':'✅','C':'⚠️','D':'❌'}.get(a['grade'],'?')
              print(f'{icon} {a[\"emoji\"]} {a[\"name\"]}: {a[\"score\"]}/100 [{a[\"grade\"]}] {a[\"bonus\"]}')
          d_agents = [a for a in d['agents'] if a['grade']=='D']
          if d_agents:
              print()
              print(f'⚠️  存在 D 级 Agent: {[a[\"name\"] for a in d_agents]}')
              print('   连续2月D级将触发流程重构问责')
          "
          fi

      - name: Update KPI Dashboard
        run: |
          # 将 KPI 监控页面和数据复制到 static 目录供线上访问
          mkdir -p static/ops-dashboard
          cp ops-dashboard/agent-kpi.html static/ops-dashboard/agent-kpi.html
          cp ops-dashboard/agent_kpi_data.json static/ops-dashboard/agent_kpi_data.json
          echo "KPI 监控页面已更新到 static/ops-dashboard/"

      - name: Generate Agent Growth Data
        run: |
          python scripts/agent_growth_engine.py --refresh-from-reports --month "$MONTH"
          python - <<'PY'
          import json
          from pathlib import Path

          growth = json.loads(Path("ops-dashboard/agent_growth_data.json").read_text(encoding="utf-8-sig"))
          sources = growth.get("data_sources", {})
          assert sources.get("refresh_mode") == "reports_only", f"Growth refresh mode unexpected: {sources.get('refresh_mode')}"
          assert sources.get("kpi_report"), "Growth KPI report source missing"
          assert "Growth dashboard refresh uses reported KPI results only" in sources.get("note", ""), "Growth non-simulation note missing"
          print("Growth reports-only validation PASS")
          PY

      - name: Publish Agent KPI and Growth Data to static/ops
        run: |
          test -f ops-dashboard/agent_kpi_data.json
          test -f ops-dashboard/agent_growth_data.json

          mkdir -p static/ops
          cp ops-dashboard/agent_kpi_data.json static/ops/agent_kpi_data.json
          cp ops-dashboard/agent_growth_data.json static/ops/agent_growth_data.json

          python - <<'PY'
          import json
          from pathlib import Path

          pairs = {
              "KPI": (Path("ops-dashboard/agent_kpi_data.json"), Path("static/ops/agent_kpi_data.json")),
              "Growth": (Path("ops-dashboard/agent_growth_data.json"), Path("static/ops/agent_growth_data.json")),
          }

          for label, (source, target) in pairs.items():
              assert target.exists(), f"{label} target missing: {target}"
              source_text = source.read_text(encoding="utf-8-sig")
              target_text = target.read_text(encoding="utf-8-sig")
              assert json.loads(source_text), f"{label} source JSON is empty or invalid"
              assert json.loads(target_text), f"{label} target JSON is empty or invalid"
              assert source.read_bytes() == target.read_bytes(), f"{label} source and target differ"

          kpi = json.loads(Path("static/ops/agent_kpi_data.json").read_text(encoding="utf-8-sig"))
          growth = json.loads(Path("static/ops/agent_growth_data.json").read_text(encoding="utf-8-sig"))
          assert "updated_at" in kpi, "KPI updated_at missing"
          assert "month" in kpi, "KPI month missing"
          assert "updated_at" in growth, "Growth updated_at missing"
          assert growth.get("group") and growth.get("employees"), "Growth group/employees missing"
          print("KPI and Growth static/ops JSON validation PASS")
          PY
          echo "Agent KPI and Growth 数据已发布到 static/ops/"

      - name: Send Feishu Notification
        if: ${{ github.event.inputs.notify == 'true' }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            KPI_EXIT="${{ steps.kpi_audit.outputs.kpi_exit }}"
            if [ "$KPI_EXIT" = "1" ]; then
              MSG="❌ [Agent KPI 月度考核] 存在 D 级 Agent，请立即关注并制定改进计划。详见 ops-dashboard/agent-kpi.html"
            else
              MSG="✅ [Agent KPI 月度考核] 全部 Agent 考核完成，无 D 级。详见 ops-dashboard/agent-kpi.html"
            fi
            curl -s -X POST "$FEISHU_WEBHOOK_URL" -H "Content-Type: application/json" \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || true
          fi

      - name: Commit KPI Results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ops-dashboard/agent_kpi_data.json ops-dashboard/agent-kpi.html static/ops-dashboard/ 2>/dev/null || true
          git add ops-dashboard/agent_growth_data.json static/ops/agent_kpi_data.json static/ops/agent_growth_data.json 2>/dev/null || true
          git add reports/agent_kpi/ 2>/dev/null || true
          git add reports/agent_growth/ 2>/dev/null || true
          # 关键修复：reports/revenue_data/ 此前从未被提交。
          # 采集器每次在 CI 里生成 revenue_data_YYYYMMDD.json，但因为不在 git add 清单里，
          # 下次 run 的干净 checkout 里该目录为空 → load_real_revenue_data() 恒返回 {}
          # → 营收 KPI 一直吃 70 分占位分。加进来才能让真实营收数据进入 KPI 考核。
          git add reports/revenue_data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无 KPI 结果变更"
          else
            git commit -m "chore: update agent KPI monthly audit results [skip ci]"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; echo "rebase失败，跳过"; }
            git push || echo "推送失败，跳过"
          fi

      - name: Upload KPI Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-kpi-report
          path: |
            reports/agent_kpi/
            ops-dashboard/agent_kpi_data.json
            reports/agent_growth/
            ops-dashboard/agent_growth_data.json
            static/ops/agent_kpi_data.json
            static/ops/agent_growth_data.json
          retention-days: 90
