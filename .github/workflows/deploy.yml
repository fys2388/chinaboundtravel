name: Deploy to Vercel

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.0.0
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Hugo version
        run: hugo version

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: List public directory
        run: ls -la public/

      - name: Deploy to Vercel
        uses: vercel/action@v25
        with:
          vercel-token: ${{ secrets.CHINABOUND }}
          vercel-org-id: team_uDnbkOAZCcHZd4GXTA31oIuz
          vercel-project-id: prj_QlS4Vg1TFBoK74PJkCJOOIaWc6jK
          vercel-args: '--prod'