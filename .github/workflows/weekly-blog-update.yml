name: Joran博文生成+双AI自动审核发布

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv PyYAML tenacity

      - name: Run Joran blog generator with Doubao AI
        env:
          DOUBAO_ARK_API_KEY: ${{ secrets.DOUBAO_ARK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python chinaboundtravel_social_bot/joran_blog_generator.py

      - name: Check affiliate link expiry
        id: affiliate-check
        run: |
          echo "=== Checking affiliate link expiry ==="
          python scripts/check_affiliate_expiry.py
          if [ $? -eq 1 ]; then
            echo "::set-output name=expiring::true"
          else
            echo "::set-output name=expiring::false"
          fi

      - name: Send expiry warning to Feishu
        if: steps.affiliate-check.outputs.expiring == 'true'
        run: |
          echo "=== Sending expiry warning ==="
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "⚠️ Klook 联盟链接即将过期！\n请尽快在 hugo.toml 中更新新的 Klook 链接。"
              }
            }' || echo "Feishu notification failed"

      - name: Build site to verify
        id: hugo-build
        continue-on-error: true
        run: hugo --gc --minify

      - name: Auto-fix build errors
        id: auto-fix
        if: steps.hugo-build.outcome == 'failure'
        run: |
          echo "=== Attempting auto-fix ==="
          python scripts/auto_fix_build.py
          if [ $? -eq 0 ]; then
            echo "::set-output name=fixed::true"
          else
            echo "::set-output name=fixed::false"
          fi

      - name: Rebuild after auto-fix
        if: steps.auto-fix.outputs.fixed == 'true'
        run: hugo --gc --minify

      - name: Commit and push generated posts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add content/_draft/*.md 2>/dev/null || true
          git add manifest.json 2>/dev/null || true
          git add config/topic_pool.json 2>/dev/null || true
          git add config/error_knowledge_base.json 2>/dev/null || true
          git add layouts/shortcodes/*.html 2>/dev/null || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto publish Joran blog | $(date '+%Y-%m-%d')"
            git push
            echo "Changes pushed successfully"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chinaboundtravel
          directory: public
          branch: main

      - name: Purge Cloudflare CDN Cache
        run: |
          echo "=== Purging Cloudflare CDN cache ==="
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            --fail --show-error --silent || echo "Cache purge skipped (CLOUDFLARE_ZONE_ID may not be set)"

      - name: Install Pillow for cover image generation
        run: pip install Pillow

      - name: Run social media distribution
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          echo "=== Running social media distribution ==="
          python chinaboundtravel_social_bot/social_publisher.py || echo "Social media distribution failed (continuing workflow)"

      - name: Commit cover image updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add static/img/china-dest/ 2>/dev/null || true
          git add manifest.json 2>/dev/null || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No cover/image changes to commit"
          else
            git commit -m "chore: update post covers for social media | $(date '+%Y-%m-%d')"
            git push || echo "Push skipped"
          fi

  failure-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [generate-blog]
    if: failure()
    steps:
      - name: Send failure notification to Feishu
        run: |
          echo "工作流执行失败，发送飞书通知..."
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ 博文生成工作流执行失败\n仓库: chinaboundtravel\n工作流: Joran博文生成+双AI自动审核发布\n时间: '"$(date '+%Y-%m-%d %H:%M:%S')"'\n请检查 GitHub Actions 日志。"
              }
            }' || echo "飞书通知发送失败，跳过"
