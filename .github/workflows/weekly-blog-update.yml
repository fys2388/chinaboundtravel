name: Joran博文生成+双AI自动审核发布

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv PyYAML tenacity

      - name: Run Joran blog generator with Doubao AI
        env:
          DOUBAO_ARK_API_KEY: ${{ secrets.DOUBAO_ARK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python chinaboundtravel_social_bot/joran_blog_generator.py

      - name: Build site to verify
        run: hugo --gc --minify

      - name: Commit and push generated posts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md 2>/dev/null || true
          git add content/_draft/*.md 2>/dev/null || true
          git add manifest.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto publish Joran blog | $(date '+%Y-%m-%d')" && git push) || true
