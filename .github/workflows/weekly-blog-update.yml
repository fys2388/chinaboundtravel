name: Joran博文生成+双AI自动审核发布

on:
  schedule:
    # 【恢复】每天生成1篇（使用 deepseek-chat + 低max_tokens，月消耗仍可控）
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv PyYAML tenacity

      - name: Run Joran blog generator with AI double review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BACKUP_API_KEY: ${{ secrets.DEEPSEEK_BACKUP_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python chinaboundtravel_social_bot/joran_blog_generator.py

      - name: Build site to verify
        run: hugo --gc --minify

      - name: Commit generated posts with [skip ci]
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/posts/*.md || true
          git add content/_draft/*.md || true
          git add manifest.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: [skip ci] auto publish Joran blog | $(date '+%Y-%m-%d')" && git push) || true