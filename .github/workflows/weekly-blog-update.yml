name: Joran博文生成+双AI自动审核发布

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  # Content generation writes to main and must NOT be cancelled by a newer run;
  # overlapping runs are queued instead (cancel-in-progress: false).
  group: joran-blog-generation
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv PyYAML tenacity Pillow

      - name: Setup git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "Git config set"

      - name: Reset stale monthly counters (auto-fix stale state)
        run: |
          python -c "
          import json, os
          from datetime import datetime, timezone
          manifest_path = 'manifest.json'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  data = json.load(f)
              month = datetime.now(timezone.utc).strftime('%Y-%m')
              # 仅跨月时重置月度计数；每日社媒计数由 social_publisher 自行跨天重置，
              # 避免本步骤在当天重复触发时把计数清零，导致每日发布限额失效
              expected_reset = f'{month}-01'
              if data.get('last_reset_date', '') != expected_reset:
                  data['month_post_count'] = 0
                  data['last_reset_date'] = expected_reset
                  print(f'[Auto-fix] Reset monthly count for {month} (preserving history for cooldown)')
              with open(manifest_path, 'w') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print('Manifest state verified OK')
          "

      - name: Run Joran blog generator with Doubao AI
        env:
          DOUBAO_ARK_API_KEY: ${{ secrets.DOUBAO_ARK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python chinaboundtravel_social_bot/joran_blog_generator.py

      - name: Check affiliate link expiry
        id: affiliate-check
        run: |
          echo "=== Checking affiliate link expiry ==="
          python scripts/check_affiliate_expiry.py
          if [ $? -eq 1 ]; then
            echo "expiring=true" >> $GITHUB_OUTPUT
          else
            echo "expiring=false" >> $GITHUB_OUTPUT
          fi

      - name: Send expiry warning to Feishu
        if: steps.affiliate-check.outputs.expiring == 'true'
        run: |
          echo "=== Sending expiry warning ==="
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "⚠️ Klook 联盟链接即将过期！\n请尽快在 hugo.toml 中更新新的 Klook 链接。"
              }
            }' || echo "Feishu notification failed"

      - name: Build site to verify
        id: hugo-build
        continue-on-error: true
        run: hugo --gc --minify

      - name: Auto-fix build errors
        id: auto-fix
        if: steps.hugo-build.outcome == 'failure'
        run: |
          echo "=== Attempting auto-fix ==="
          python scripts/auto_fix_build.py
          if [ $? -eq 0 ]; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild after auto-fix
        if: steps.auto-fix.outputs.fixed == 'true'
        run: hugo --gc --minify

      - name: Enforce high-risk content human gate (P0-5)
        run: |
          echo "=== Enforcing risk gate (HIGH-risk content must NOT auto-publish) ==="
          python scripts/check_risk_gate.py

      - name: 2.0 Content Quality Gate (事实检查 + 品牌审计 + 质量验证 + ID审计)
        run: |
          echo "=== [2.0] 内容事实检查 (content_fact_guard) ==="
          python scripts/content_fact_guard.py || echo "::warning::事实检查发现问题，已记录（非阻断）"

          echo "=== [2.0] 品牌身份审计 (brand_identity_audit --legacy) ==="
          python scripts/brand_identity_audit.py --legacy || echo "::warning::品牌审计发现旧人设表述，已记录（非阻断）"

          echo "=== [2.0] 内容质量验证 (content_quality_validator) ==="
          python scripts/content_quality_validator.py --json || echo "::warning::内容质量验证发现问题，已记录（非阻断）"

          echo "=== [2.0] 内容ID审计 (content_id_audit audit --strict) ==="
          python scripts/content_id_audit.py audit --strict || {
            echo "::error::内容ID审计失败（存在缺失或重复的content_id），阻断提交"
            exit 1
          }

          echo "=== [2.0] 内容质量门控完成 ==="

      - name: Commit and push all changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add ALL changed files comprehensively
          git add content/posts/ 2>/dev/null || true
          git add content/_draft/ 2>/dev/null || true
          git add manifest.json 2>/dev/null || true
          git add config/topic_pool.json 2>/dev/null || true
          git add config/error_knowledge_base.json 2>/dev/null || true
          git add layouts/shortcodes/*.html 2>/dev/null || true
          git add static/img/ 2>/dev/null || true
          
          # Check if there are actual changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Changes detected, committing..."
            git status
            git commit -m "chore: auto publish Joran blog | $(date '+%Y-%m-%d')"
            # 远端可能有并发提交，先 rebase 再 push，最多重试 5 次
            # 2.0优化：增加重试次数到5次，间隔60秒，rebase失败后尝试merge
            PUSHED=""
            for i in 1 2 3 4 5; do
              echo "=== Push attempt $i/5 ==="
              # 先尝试rebase
              if git pull --rebase origin main 2>&1; then
                echo "Rebase successful"
              else
                echo "Rebase failed, aborting and trying merge..."
                git rebase --abort 2>/dev/null || true
                git merge --abort 2>/dev/null || true
                # 尝试merge代替rebase
                if git pull --no-rebase origin main 2>&1; then
                  echo "Merge successful"
                else
                  echo "Merge also failed, resetting to remote..."
                  git merge --abort 2>/dev/null || true
                  git reset --hard origin/main 2>/dev/null || true
                  echo "Reset to origin/main, will retry"
                  sleep 60
                  continue
                fi
              fi
              # 尝试push
              if git push 2>&1; then
                echo "Changes pushed successfully on attempt $i"
                PUSHED="yes"
                break
              fi
              echo "Push attempt $i failed, retrying in 60s..."
              sleep 60
            done
            if [ -z "$PUSHED" ]; then
              echo "::error::Failed to push changes after 5 attempts"
              echo "::warning::This may be due to concurrent commits. Please check and retry manually."
              echo "Continuing without push (deploy may need manual trigger)"
            fi
          fi

      - name: Trigger Cloudflare Pages deploy
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Triggering Cloudflare Pages deploy workflow ==="
          if command -v gh &> /dev/null; then
            gh workflow run deploy-cloudflare-pages.yml --ref main || echo "gh workflow run failed (non-critical, deploy also triggered by push)"
          else
            echo "gh CLI not available, skipping (deploy will be triggered automatically by push to main)"
          fi
          echo "Deploy trigger step completed"

      - name: Run social media distribution
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          echo "=== Running social media distribution ==="
          python chinaboundtravel_social_bot/social_publisher.py 2>&1 | tee /tmp/social_publisher_output.log
          echo "Social media distribution step completed (check log above for any failures)"

  failure-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [generate-blog]
    if: failure()
    steps:
      - name: Send failure notification to Feishu
        run: |
          echo "工作流执行失败，发送飞书通知..."
          curl -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ 博文生成工作流执行失败\n仓库: chinaboundtravel\n工作流: Joran博文生成+双AI自动审核发布\n时间: '"$(date '+%Y-%m-%d %H:%M:%S')"'\n请检查 GitHub Actions 日志。"
              }
            }' || echo "飞书通知发送失败，跳过"

