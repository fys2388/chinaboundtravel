name: AI Agent Orchestrator - 7 Agents Weekly Run

on:
  schedule:
    # 每周一 UTC 00:00 (北京时间周一 08:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      agents:
        description: '要运行的Agent (all, seo, revenue, conversion, content, social, user, self_learning)'
        required: false
        default: 'all'
      generate_dashboard:
        description: '是否生成统一仪表盘'
        required: false
        default: 'true'

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  orchestrate:
    name: Run 7 AI Agents Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv google-auth google-auth-httplib2 google-api-python-client pytz

      - name: Configure git
        run: |
          git config --global user.name "AI Agent Orchestrator"
          git config --global user.email "ai-agent@chinaboundtravel.com"
          git config --global pull.rebase false

      - name: AI Governance Check (Kill Switch + Permissions)
        run: |
          echo "=== AI Governance Check ==="
          python scripts/ai_governance.py --status
          echo ""
          echo "=== Kill Switch Verification ==="
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from ai_governance import check_kill_switch
          is_safe, reason = check_kill_switch()
          if not is_safe:
              print(f'KILL SWITCH ACTIVE: {reason}')
              print('AI Agent execution blocked by Kill Switch.')
              sys.exit(1)
          print('Kill Switch: OK (not active)')
          print('Permission boundaries: L0-L3 enforced via ai_governance module')
          "

      - name: Run 7 Agents Orchestrator
        env:
          # GA4
          GA4_API_KEY: ${{ secrets.GA4_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          # GSC
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          # Travelpayouts
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TRAVELPAYOUTS_DRIVE_ID: ${{ secrets.TRAVELPAYOUTS_DRIVE_ID }}
          # MailerLite
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          # Buffer
          BUFFER_WORKER_URL: ${{ secrets.BUFFER_WORKER_URL }}
          NEW_BUFFER_WORKER_URL: ${{ secrets.NEW_BUFFER_WORKER_URL }}
          BUFFER_API_TOKEN_A: ${{ secrets.BUFFER_API_TOKEN_A }}
          BUFFER_API_TOKEN_B: ${{ secrets.BUFFER_API_TOKEN_B }}
          # Cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Feishu
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          echo "=== 开始运行7大AI Agent编排器 ==="
          echo "运行时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Agent选择: ${{ github.event.inputs.agents || 'all' }}"

          # 运行编排器
          if [ "${{ github.event.inputs.agents || 'all' }}" = "all" ]; then
            python scripts/run_all_agents.py --all
          else
            python scripts/run_all_agents.py --${{ github.event.inputs.agents }}
          fi

          echo "=== 7大AI Agent编排器运行完成 ==="

      - name: Generate Unified Dashboard
        if: ${{ github.event.inputs.generate_dashboard != 'false' }}
        run: |
          echo "=== 生成统一运营仪表盘 ==="
          python scripts/generate_dashboard.py
          echo "=== 仪表盘生成完成 ==="

      - name: Generate Growth Memory Update
        run: |
          echo "=== 更新Growth Memory ==="
          if [ -f "scripts/growth_memory_updater.py" ]; then
            python scripts/growth_memory_updater.py --weekly
          else
            echo "Growth Memory更新脚本不存在，跳过"
          fi

      - name: Commit and Push Results
        run: |
          echo "=== 提交Agent运行结果 ==="

          # 添加生成的报告
          git add reports/orchestration/ 2>/dev/null || true
          git add reports/dashboard/ 2>/dev/null || true
          git add reports/growth_memory/ 2>/dev/null || true
          git add reports/seo/ 2>/dev/null || true
          git add reports/revenue/ 2>/dev/null || true
          git add reports/conversion/ 2>/dev/null || true
          git add reports/content/ 2>/dev/null || true
          git add reports/social/ 2>/dev/null || true
          git add reports/user/ 2>/dev/null || true
          git add reports/learning/ 2>/dev/null || true

          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "feat(ai-ops): 7大AI Agent周度运行结果 - $(date -u '+%Y-%m-%d')

            - 自动运行7大AI Agent编排器
            - 生成统一运营报告和仪表盘
            - 更新Growth Memory学习记忆
            - 数据来源: GA4 + GSC + Travelpayouts + MailerLite + Buffer + 本地扫描"

            # Push with retry to handle transient ref-lock contention
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "push ok (attempt $i)"
                break
              fi
              echo "push failed (attempt $i), rebase and retry in $((i * 15))s..."
              sleep $((i * 15))
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            done
            git ls-remote --exit-code origin main >/dev/null 2>&1 || { echo "::error::push 失败"; exit 1; }
            echo "=== 结果已提交并推送 ===" 
          fi

      - name: Send Feishu Notification
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          echo "=== 发送飞书通知 ==="
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            STATUS="${{ job.status }}"
            python scripts/send_feishu_notification.py \
              --text "AI Agent编排器周度运行完成
              状态: ${STATUS}
              时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

              包含: 7大Agent运行 + 统一仪表盘 + Growth Memory更新

              查看报告: reports/orchestration/latest_unified_report.md"
          else
            echo "FEISHU_WEBHOOK_URL未配置，跳过通知"
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-reports-${{ github.run_id }}
          path: |
            reports/orchestration/
            reports/dashboard/
            reports/growth_memory/
          retention-days: 30
