name: Deploy Buffer Worker

on:
  push:
    branches: [main]
    paths: ['buffer-worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          if [ -n "$CLOUDFLARE_GLOBAL_KEY" ] && [ -n "$CLOUDFLARE_EMAIL" ]; then
            echo "Using Global API Key authentication"
            echo "AUTH_METHOD=global_key" >> $GITHUB_ENV
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Using API Token authentication"
            echo "AUTH_METHOD=api_token" >> $GITHUB_ENV
          else
            echo "::error::No Cloudflare credentials found. Set CLOUDFLARE_GLOBAL_KEY+CLOUDFLARE_EMAIL or CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Deploy Worker (production env + workers.dev)
        working-directory: buffer-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Global Key 模式下清空 API Token，避免 wrangler 优先用权限不足的 Token
          if [ "$AUTH_METHOD" = "global_key" ]; then
            unset CLOUDFLARE_API_TOKEN
            echo "Authenticating with Global API Key ($CLOUDFLARE_EMAIL)"
          else
            echo "Authenticating with API Token"
          fi
          # 默认 env 更新 workers.dev 子域（兼容旧配置）
          npx -y wrangler@3 deploy || echo "::warning::默认 env 部署失败"
          # production env 更新自定义域 buffer-worker.chinaboundtravel.com
          npx -y wrangler@3 deploy --env production || { echo "::error::production env 部署失败"; exit 1; }
