name: Deploy Buffer Worker

on:
  push:
    branches: [main]
    paths: ['buffer-worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty."
            exit 1
          fi

      - name: Deploy Worker (production env + workers.dev)
        working-directory: buffer-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler 4.x does not require User Details Read permission (unlike v3)
          # 默认 env 更新 workers.dev 子域（兼容旧配置）
          npx -y wrangler@4 deploy || echo "::warning::默认 env 部署失败"
          # production env 更新自定义域 buffer-worker.chinaboundtravel.com
          npx -y wrangler@4 deploy --env production || { echo "::error::production env 部署失败"; exit 1; }
