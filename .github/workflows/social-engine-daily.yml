name: Social Engine Daily (闭环)

on:
  schedule:
    # 每日 UTC 00:30 / 12:30（北京时间 08:30 / 20:30），配合美东黄金时段
    - cron: "0 13,1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date (YYYY-MM-DD), default today"
        required: false
        type: string
      build_if_empty:
        description: "Rebuild inventory if empty (true/false)"
        required: false
        default: "false"
        type: string

concurrency:
  group: social-engine-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv pillow
          cd buffer-worker && npm install --no-audit --no-fund 2>/dev/null || true


      - name: AI Governance Check (Kill Switch)
        run: |
          echo "=== AI Governance Check ==="
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from ai_governance import check_kill_switch
          is_safe, reason = check_kill_switch(subsystem='social_publishing')
          if not is_safe:
              print(f'KILL SWITCH ACTIVE: {reason}')
              print('Social publishing blocked by Kill Switch.')
              sys.exit(1)
          print('Kill Switch: OK (not active)')
          "


      - name: Ensure inventory exists
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ ! -s content/social/inventory.json ]; then
            if [ "${{ github.event.inputs.build_if_empty || 'false' }}" = "true" ]; then
              echo "资产库为空，重新生成..."
              python scripts/social_content_agent.py build-inventory --top-n 20
            else
              echo "资产库为空且未要求重建，跳过"
              exit 0
            fi
          else
            echo "资产库已存在"
          fi

      - name: Generate schedule
        run: |
          python scripts/social_content_agent.py plan --date "${{ github.event.inputs.date || 'today' }}" 2>/dev/null || \
          python scripts/social_content_agent.py plan

      - name: Check Buffer Worker health
        env:
          BUFFER_WORKER_URL: ${{ secrets.BUFFER_WORKER_URL || 'https://buffer-worker.chinaboundtravel.com/publish' }}
          NEW_BUFFER_WORKER_URL: ${{ secrets.NEW_BUFFER_WORKER_URL || 'https://buffer-worker.chinaboundtravel.com/publish' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          # 发布前探测两个 Worker：404 "Worker not found" 或连接失败 = 未部署/不可用，
          # 直接跳过发布并飞书告警，避免"静默 0 发布"。
          fail=0
          for url in "$BUFFER_WORKER_URL" "$NEW_BUFFER_WORKER_URL"; do
            host="${url%%/publish*}"
            code=$(curl -sS -o /tmp/worker_body.txt -w "%{http_code}" --max-time 20 "$host/health" || echo "000")
            if [ "$code" = "000" ]; then
              echo "::error::Buffer Worker 连接失败 (timeout): $host"
              fail=1
            elif [ "$code" = "404" ] && grep -qi "Worker not found" /tmp/worker_body.txt 2>/dev/null; then
              echo "::error::Buffer Worker 未部署 (404 Worker not found): $host"
              fail=1
            else
              echo "Buffer Worker 健康 (HTTP $code): $host"
            fi
          done
          if [ "$fail" = "1" ]; then
            if [ -n "$FEISHU_WEBHOOK_URL" ]; then
              curl -s -X POST "$FEISHU_WEBHOOK_URL" -H "Content-Type: application/json" \
                -d '{"msg_type":"text","content":{"text":"🚨 社媒发布阻断：Buffer Worker 不可用（未部署/超时），今日跳过发布。请部署 buffer-worker 后手动重跑 Social Engine Daily。"}}' || true
            fi
            exit 1
          fi

      - name: Generate unique post images (真实文生图，消除配图重复)
        env:
          IMAGE_GEN_ENABLED: "1"
          DOUBAO_ARK_API_KEY: ${{ secrets.DOUBAO_ARK_API_KEY }}
          ARK_IMAGE_MODEL: ${{ vars.ARK_IMAGE_MODEL || '' }}
        run: |
          echo "=== 为资产库素材生成独立配图（后端：Ark Seedream → pollinations）==="
          python scripts/social_content_agent.py gen-images --limit 12 || \
            echo "::warning::文生图未完成（限流/服务不可用），沿用文章封面继续发布"

      - name: P0-2 Image Quality Gate (社媒图片验证)
        run: |
          echo "=== [P0-2] 发布前图片质量验证 ==="
          python scripts/social_image_prepublish_check.py || echo "::warning::图片验证发现问题（非阻断，P1后切换严格模式）"
          echo "=== 图片验证完成 ==="

      - name: Publish today's batch (Buffer Worker)
        env:
          # 完整发布端点（worker /publish 处理双账户分流）
          BUFFER_WORKER_URL: ${{ secrets.BUFFER_WORKER_URL || 'https://buffer-worker.chinaboundtravel.com/publish' }}
          NEW_BUFFER_WORKER_URL: ${{ secrets.NEW_BUFFER_WORKER_URL || 'https://buffer-worker.chinaboundtravel.com/publish' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          TODAY="${{ github.event.inputs.date }}"
          if [ -z "$TODAY" ]; then TODAY=$(date -u +%F); fi
          echo "=== 发布 $TODAY 批次 ==="
          # 不再吞掉发布失败：0 发布或部分失败必须让 run 失败，触发 Error Alert/飞书告警
          python scripts/social_content_agent.py publish --auto --date "$TODAY"

      - name: Pull social analytics (Buffer API)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKEN_2: ${{ secrets.BUFFER_ACCESS_TOKEN_2 }}
        run: |
          python scripts/social_analytics_pull.py --days 7 || echo "analytics pull skipped (no token or API error)"

      - name: Generate daily social report
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python scripts/social_reports.py daily --print-block 2>/dev/null || echo "日报生成跳过"

      - name: Commit inventory & reports back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 提交所有生成的产物（inventory / 排期 / 日报 / manifest），
          # 避免遗漏导致 pull --rebase 报 unstaged changes
          git add -A content/social reports/social manifest.json static/img/china-dest/social 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无待提交变更"
          else
            # 若含新生成配图（static/img/china-dest/social），用不带 [skip ci] 的提交触发 Cloudflare Pages 部署上线；
            # 否则普通 [skip ci] 提交（避免无谓重建）
            if git diff --staged --name-only | grep -q '^static/img/china-dest/social/'; then
              git commit -m "feat(social): generate unique post images (trigger deploy)"
              echo "::notice::新配图已提交，触发 Cloudflare Pages 部署；图片上线后下一轮自动发布"
            else
              git commit -m "chore(social): sync inventory & reports [skip ci]"
            fi
          fi
          # 远端可能有并发提交（如博客生成工作流），用 --autostash 自动暂存
          # 未提交改动再 rebase，避免 "cannot pull with rebase" 失败
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; echo "::error::rebase 失败"; exit 1; }
          git push

      - name: Feishu notification
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -s -X POST "$FEISHU_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"msg_type":"text","content":{"text":"🔁 社媒引擎闭环执行完成"}}' || true
          fi
