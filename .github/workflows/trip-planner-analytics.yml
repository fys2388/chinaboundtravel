name: Trip Planner Analytics

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trip-planner-analytics
  cancel-in-progress: true

jobs:
  analytics:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull analytics data
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          python scripts/setup_analytics.py --days 7

      - name: Generate report
        run: |
          mkdir -p reports/trip-planner
          python scripts/trip_planner_analytics.py --days 7 --export-csv reports/trip-planner/trip_planner_report.csv

      - name: Upload analytics report
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-analytics-${{ github.run_number }}
          path: reports/trip-planner/
          retention-days: 30

      - name: Commit analytics data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/trip-planner/
          git commit -m "chore: update trip planner analytics [skip ci]" || true
          git push origin main || true
