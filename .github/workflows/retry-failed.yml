name: Retry Failed Jobs

on:
  workflow_run:
    workflows: ["Joran博文生成+双AI自动审核发布", "Social Media Distributor", "Content Rotation Distributor"]
    types: [completed]
    branches: [main]

concurrency:
  group: retry-failed-jobs
  cancel-in-progress: false

jobs:
  check-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 分类、责任人和修复指引统一由 Error Alert 发送，避免同一失败重复告警。

      - name: Wait before retry
        run: sleep 300

      - name: Retry workflow
        if: success()
        run: |
          echo "Retrying workflow: ${{ github.event.workflow_run.name }}"
          if ! command -v gh &> /dev/null; then
            echo "::error::gh CLI not available"
            exit 1
          fi
          if ! gh workflow run "${{ github.event.workflow_run.file_name }}" --ref main; then
            echo "::error::gh workflow run failed for ${{ github.event.workflow_run.file_name }}"
            exit 1
          fi
          echo "Retry dispatched: ${{ github.event.workflow_run.file_name }}"
