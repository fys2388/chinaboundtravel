name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'static/**'
      - 'layouts/**'
      - 'themes/**'
      - 'config/**'
      - 'hugo.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build static site
        run: |
          hugo version
          hugo --gc --minify 2>&1

      - name: Verify Cloudflare API Token
        run: |
          echo "=== Verifying CLOUDFLARE_API_TOKEN ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: API Token verification failed!"
            exit 1
          fi
          echo "API Token is valid"

      - name: Create deployment ZIP
        run: |
          cd public && zip -r ../deploy.zip . && cd ..

      - name: Deploy to Cloudflare Pages via Direct Upload API
        run: |
          echo "=== Deploying to Cloudflare Pages ==="
          DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/chinaboundtravel/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "deployments[manifest]={\"manifest_entries\":[],\"branch\":\"main\"};type=application/json" \
            -F "deployments[content]=@deploy.zip;type=application/zip")
          HTTP_CODE=$(echo "$DEPLOY_RESPONSE" | tail -n1)
          BODY=$(echo "$DEPLOY_RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Deployment failed!"
            exit 1
          fi
          echo "Deployment successful!"

      - name: Post to Social Media via Worker
        run: |
          echo "=== 扫描近期文章并发布到社媒 ==="
          pip install requests Pillow --quiet 2>&1 | tail -n 5
          python chinaboundtravel_social_bot/social_publisher.py || echo "社媒发布跳过"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Purge Cloudflare CDN Cache
        run: |
          echo "=== Purging Cloudflare CDN cache ==="
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            --fail --show-error --silent || echo "Cache purge skipped (CLOUDFLARE_ZONE_ID may not be set)"