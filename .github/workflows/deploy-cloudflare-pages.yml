name: Post-deploy Tasks

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'static/**'
      - 'layouts/**'
      - 'themes/**'
      - 'assets/**'
      - 'config/**'
      - 'hugo.toml'
  workflow_dispatch:

concurrency:
  group: post-deploy-tasks
  cancel-in-progress: true

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build site
        env:
          HUGO_ENV: production
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '032a874de4e89298d9f492590b08ecba' }}
          command: pages deploy public --project-name=chinaboundtravel

      - name: Post to Social Media via Worker
        run: |
          echo "=== 扫描近期文章并发布到社媒 ==="
          pip install requests Pillow --quiet 2>&1 | tail -n 5
          python chinaboundtravel_social_bot/social_publisher.py || echo "社媒发布跳过"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Commit social manifest back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "no manifest changes to commit" || (git commit -m "chore: sync social publish manifest" && git push origin main)

      - name: Purge Cloudflare CDN Cache
        if: vars.CLOUDFLARE_ZONE_ID != ''
        run: |
          echo "=== Purging Cloudflare CDN cache ==="
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            --fail --show-error --silent || echo "Cache purge skipped"
          echo "Done."