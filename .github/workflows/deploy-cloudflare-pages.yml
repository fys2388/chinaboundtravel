name: Post-deploy Tasks

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'static/**'
      - 'layouts/**'
      - 'themes/**'
      - 'assets/**'
      - 'config/**'
      - 'hugo.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: post-deploy-tasks
  cancel-in-progress: true

jobs:
  post-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build site
        env:
          HUGO_ENV: production
        run: |
          echo "=== Hugo version ==="
          hugo version
          echo "=== Building site ==="
          hugo --gc --minify 2>&1
          echo "=== Build exit code: $? ==="
          echo "=== Build output files ==="
          ls -la public/ | head -20
          echo "=== Total files ==="
          find public -type f | wc -l

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '032a874de4e89298d9f492590b08ecba' }}
          command: pages deploy public --project-name=chinaboundtravel

      - name: Post to Social Media via Worker
        run: |
          echo "=== 扫描近期文章并发布到社媒 ==="
          pip install requests Pillow --quiet 2>&1 | tail -n 5
          python chinaboundtravel_social_bot/social_publisher.py || echo "社媒发布跳过"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Commit social manifest back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "no manifest changes to commit" || (git commit -m "chore: sync social publish manifest" && git push origin main)

      - name: Purge Cloudflare CDN Cache
        if: vars.CLOUDFLARE_ZONE_ID != ''
        run: |
          echo "=== Purging Cloudflare CDN cache ==="
          python3 - <<'PY'
          import json, urllib.request, os
          zone = os.environ["CF_ZONE"]
          token = os.environ.get("CF_TOKEN", "")
          gkey = os.environ.get("CF_GLOBAL_KEY", "")
          email = os.environ.get("CF_EMAIL", "")
          url = "https://api.cloudflare.com/client/v4/zones/" + zone + "/purge_cache"
          def purge(auth):
              req = urllib.request.Request(url, method="POST")
              req.add_header("Content-Type", "application/json")
              if auth == "token":
                  req.add_header("Authorization", "Bearer " + token)
              else:
                  req.add_header("X-Auth-Email", email)
                  req.add_header("X-Auth-Key", gkey)
              with urllib.request.urlopen(req, data=b'{"purge_everything":true}', timeout=30) as r:
                  return json.load(r)
          try:
              print("purge result:", purge("token").get("success"))
          except Exception as e:
              print("token purge failed:", e)
              try:
                  print("purge via global key:", purge("global").get("success"))
              except Exception as e2:
                  print("purge skipped:", e2)
          PY
          echo "Done."

      - name: Ensure HTML Edge Cache Rule (Cache Everything, TTL 1h)
        if: vars.CLOUDFLARE_ZONE_ID != ''
        run: |
          echo "=== Ensuring HTML cache rule (idempotent, preserves existing rules) ==="
          python3 - <<'PY'
          import json, urllib.request, os
          zone = os.environ["CF_ZONE"]
          token = os.environ.get("CF_TOKEN", "")
          gkey = os.environ.get("CF_GLOBAL_KEY", "")
          email = os.environ.get("CF_EMAIL", "")
          base = "https://api.cloudflare.com/client/v4/zones/" + zone + "/rulesets"

          def api(method, url, payload=None, auth="token"):
              req = urllib.request.Request(url, method=method)
              if auth == "token":
                  req.add_header("Authorization", "Bearer " + token)
              else:
                  req.add_header("X-Auth-Email", email)
                  req.add_header("X-Auth-Key", gkey)
              req.add_header("Content-Type", "application/json")
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              with urllib.request.urlopen(req, data=data, timeout=30) as r:
                  return json.load(r)

          def auth_for_first_call():
              # figure out which credential works for the zone (token preferred, fallback global key)
              try:
                  api("GET", base + "?phase=http_request_cache_settings", auth="token")
                  return "token"
              except Exception:
                  try:
                      api("GET", base + "?phase=http_request_cache_settings", auth="global")
                      return "global"
                  except Exception as e:
                      print("API error (both credentials):", e)
                      raise SystemExit(0)  # non-fatal: do not break deploys

          auth = auth_for_first_call()
          print("using auth:", "token" if auth == "token" else "global-key")
          rs = api("GET", base + "?phase=http_request_cache_settings", auth=auth).get("result", [])
          ruleset_id = None
          existing = []
          if rs:
              ruleset_id = rs[0]["id"]
              existing = rs[0].get("rules", [])
          existing = [r for r in existing if r.get("description") != "cbt-html-edge-cache-1h (audit 2026-08-27)"]
          my_rule = {
              "expression": '(http.host eq "www.chinaboundtravel.com" and not starts_with(http.request.uri.path, "/api") and not http.request.uri.path contains ".")',
              "description": "cbt-html-edge-cache-1h (audit 2026-08-27)",
              "action": "cache",
              "action_parameters": {"cache": True, "edge_ttl": {"mode": "override_origin", "default": 3600}},
          }
          existing.append(my_rule)
          body = {"name": "cbt-html-edge-cache", "kind": "zone", "phase": "http_request_cache_settings", "rules": existing}
          if ruleset_id:
              resp = api("PUT", base + "/" + ruleset_id, body, auth=auth)
          else:
              resp = api("POST", base + "/phases/http_request_cache_settings/entrypoint", body, auth=auth)
          print("cache rule ensured:", resp.get("success"))
          if not resp.get("success"):
              print("errors:", json.dumps(resp.get("errors", []))[:400])
          PY
          echo "Done."
        env:
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}