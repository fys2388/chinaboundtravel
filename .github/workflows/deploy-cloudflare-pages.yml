name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
      - 'content/_draft/**'
      - 'content/resources/**'
      - 'content/cities/**'
      - 'static/**'
      - 'layouts/**'
      - 'themes/**'
      - 'config/**'
      - 'hugo.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        id: hugo-build
        continue-on-error: true
        run: hugo --gc --minify

      - name: Auto-fix build errors
        id: auto-fix
        if: steps.hugo-build.outcome == 'failure'
        run: |
          echo "=== Attempting auto-fix ==="
          pip install requests --quiet
          python scripts/auto_fix_build.py --push
          if [ $? -eq 0 ]; then
            echo "::set-output name=fixed::true"
          else
            echo "::set-output name=fixed::false"
          fi

      - name: Rebuild after auto-fix
        if: steps.auto-fix.outputs.fixed == 'true'
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chinaboundtravel
          directory: public
          branch: main

      - name: Post to Social Media via Worker
        run: |
          echo "=== 扫描近期文章并发布到社媒 ==="
          pip install requests Pillow --quiet 2>&1 | tail -n 5
          python chinaboundtravel_social_bot/social_publisher.py || echo "社媒发布跳过"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: Purge Cloudflare CDN Cache
        run: |
          echo "=== Purging Cloudflare CDN cache ==="
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            --fail --show-error --silent || echo "Cache purge skipped (CLOUDFLARE_ZONE_ID may not be set)"
