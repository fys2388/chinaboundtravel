name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
      - 'content/_draft/**'
      - 'static/**'
      - 'layouts/**'
      - 'themes/**'
      - 'config/**'
      - 'hugo.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build static site
        run: hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chinaboundtravel
          directory: public
          branch: main

      - name: Post to Social Media via Worker
        run: |
          echo "=== 扫描近期文章并发布到社媒 ==="
          pip install requests Pillow --quiet 2>&1 | tail -n 5
          python chinaboundtravel_social_bot/social_publisher.py || echo "社媒发布跳过"
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
