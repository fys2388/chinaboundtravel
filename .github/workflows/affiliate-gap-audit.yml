name: Affiliate Gap Audit (2.0 联盟链接缺口审计)

on:
  schedule:
    # 每周四北京时间 09:00 (UTC 1:00)，检测联盟链接缺口
    - cron: '0 1 * * 4'
  workflow_dispatch:
    inputs:
      no_ga4:
        description: "跳过GA4数据（快速模式）"
        required: false
        default: "false"
        type: boolean

jobs:
  affiliate-gap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv PyYAML pandas

      - name: Run Affiliate Gap Detector
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          NO_GA4="${{ github.event.inputs.no_ga4 || 'false' }}"
          
          echo "=== [2.0] 联盟链接缺口审计 ==="
          
          if [ "$NO_GA4" = "true" ]; then
            echo "=== 快速模式（跳过GA4）==="
            python scripts/affiliate_gap_detector.py --no-ga4
          else
            python scripts/affiliate_gap_detector.py
          fi
          
          echo "=== [2.0] 联盟链接缺口审计完成 ==="

      - name: Send Feishu notification if gaps found
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          echo "=== 检查是否有联盟链接缺口 ==="
          # 读取最新的审计报告，提取缺口数量
          if [ -f reports/affiliate_gap_report.json ]; then
            GAPS=$(python -c "import json; d=json.load(open('reports/affiliate_gap_report.json')); print(d.get('gaps', 0))" 2>/dev/null || echo "0")
            echo "检测到 $GAPS 个联盟链接缺口"
            
            if [ "$GAPS" -gt "0" ] && [ -n "$FEISHU_WEBHOOK_URL" ]; then
              curl -s -X POST "$FEISHU_WEBHOOK_URL" -H "Content-Type: application/json" \
                -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ [2.0] 联盟链接缺口审计：检测到 $GAPS 个缺口，请查看报告并补全联盟链接。\"}}" || true
            fi
          else
            echo "未找到审计报告文件"
          fi

      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/affiliate_gap_report.json 2>/dev/null || true
          git add reports/affiliate/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无联盟链接审计报告变更"
          else
            git commit -m "chore: update affiliate gap audit report [skip ci]"
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; echo "rebase失败，跳过"; }
            git push || echo "推送失败，跳过"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-gap-report
          path: reports/affiliate_gap_report.json
          retention-days: 30
