name: Monthly Ebook Guide Update

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 Pillow

      - name: Generate monthly ebook update
        run: python chinaboundtravel_social_bot/scripts/monthly_ebook_update.py

      - name: "Guard: truncate long titles"
        run: |
          python -c "
          import glob, re
          fixed = 0
          for f in glob.glob('content/posts/*.md'):
              with open(f, 'r', encoding='utf-8') as fh:
                  text = fh.read()
              m = re.search(r'^title:\s*[\"\']?(.+?)[\"\']?\s*$', text, re.M)
              if m and len(m.group(1)) > 55:
                  old = m.group(1)
                  new = old[:52].rstrip() + '...'
                  text = text.replace(m.group(0), 'title: \"' + new + '\"', 1)
                  with open(f, 'w', encoding='utf-8') as fh:
                      fh.write(text)
                  fixed += 1
                  print('  Fixed:', f, '->', len(new), 'chars')
          print('Titles fixed:', fixed)
          "

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: hugo --minify

      - name: Commit and push with skip ci
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add layouts/partials/pricing-table.html 2>/dev/null || true
          git add content/posts/ 2>/dev/null || true
          git add content/ebook/ 2>/dev/null || true
          git add static/downloads/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: monthly ebook update" && git push) || true
