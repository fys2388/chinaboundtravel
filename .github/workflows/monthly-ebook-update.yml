name: Monthly Ebook Guide Update

on:
  schedule:
    # UTC 06:00 = 北京时间14:00 每月1日
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate monthly ebook update post
        run: |
          python << 'EOF'
          import os
          from datetime import datetime, timedelta

          now = datetime.utcnow()
          version = now.strftime("%Y.%m")
          month_name = now.strftime("%B %Y")
          date_str = now.strftime("%Y-%m-%d")

          print(f"生成电子书版本: {version} ({month_name})")

          pricing_path = "layouts/partials/pricing-table.html"
          if os.path.exists(pricing_path):
              with open(pricing_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              import re
              content_new = re.sub(r'ChinaBound Travel Guide \d{4}\.\d{2}', f'ChinaBound Travel Guide {version}', content)
              if content != content_new:
                  with open(pricing_path, 'w', encoding='utf-8') as f:
                      f.write(content_new)
                  print(f"✓ pricing-table.html 版本号已更新到 {version}")
              else:
                  print(f"✓ pricing-table.html 已为最新版本 {version}")

          posts_dir = "content/posts"
          filename = f"{date_str}-chinabound-travel-guide-{version.replace('.', '-')}-monthly-update.md"
          filepath = os.path.join(posts_dir, filename)

          title = f"ChinaBound Travel Guide {version} — Now Updated With Latest Visa Rules"
          categories = "China Essentials"

          markdown_content = f"""---
title: "{title}"
date: {now.strftime("%Y-%m-%dT%H:%M:%S+00:00")}
lastmod: {now.strftime("%Y-%m-%dT%H:%M:%S+00:00")}
description: "The {month_name} edition of the ChinaBound Travel Guide is here — updated with this month's visa policy changes, new crowd data, and safety recommendations for American travelers."
summary: "Monthly update: the {month_name} edition covers all visa rule changes, new Scenic Spot crowd levels, and updated payment system guidance for travelers heading to China."
tags: ["China Travel", "Visa Updates", "Travel Guide", "China Visa", "Travel Planning"]
categories: ["{categories}"]
ShowToc: true
TocOpen: false
weight: 1
draft: false
---

## ChinaBound Travel Guide Now at Version {version}

Every month, the ChinaBound Travel Guide PDF gets a fresh update with the latest information travelers need. This {month_name} edition includes:

### What's New in Version {version}

1. **Latest Visa Policy Updates** — All changes from the past month affecting 15-day visa-free, L-visa, and multi-entry tourist visas for American passport holders
2. **Updated Crowd Forecasts** — New data on which scenic spots are overcrowded this month, with suggested alternatives and best visiting times
3. **Payment System Refresh** — Current status of Alipay, WeChat Pay, and international card acceptance at major tourist destinations
4. **Safety & Scam Alerts** — New scam patterns reported by travelers in the past 30 days
5. **Recommended Routes** — Seasonal travel recommendations based on current weather, holiday schedules, and crowd patterns

### For Subscribers

All Monthly Radar and Annual Elite Pass subscribers automatically get the updated PDF. Check your inbox (or spam folder) for the latest download link sent to your registered email.

If you're not yet a subscriber, [view the pricing plans →](/pricing)

### What's Coming Next Month

- Expect updates on summer travel season planning (if June-July) or winter/spring seasonal guides
- Additional city-specific mini-guides released weekly
- AI trip planner template expansion for {now.strftime("%B")} travel

Need something specific covered in the next update? Reply to any newsletter email with your request.

---

*Last updated: {now.strftime("%B %d, %Y")}*
"""

          if not os.path.exists(filepath):
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(markdown_content)
              print(f"✓ 已生成文章: {filename}")
          else:
              print(f"✓ 文章已存在: {filename}")

          EOF

      - name: Build with Hugo
        run: hugo --minify

      - name: Commit and push changes with [skip ci]
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add layouts/partials/pricing-table.html || true
          git add content/posts/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: [skip ci] Monthly ebook update $(date '+%Y.%m')" && git push) || true