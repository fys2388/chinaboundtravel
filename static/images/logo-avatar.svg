<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A6EA5"/>
      <stop offset="100%" style="stop-color:#2d5a8a"/>
    </linearGradient>
    <linearGradient id="cGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9fd4"/>
      <stop offset="100%" style="stop-color:#3A6EA5"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
  </defs>

  <!-- Full circular background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>

  <!-- Inner circle border -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Main C shape (centered, scaled) -->
  <path
    d="M100 35 C65 35 45 58 45 100 C45 142 65 165 100 165 C122 165 142 150 152 128 C156 120 158 110 158 110 C158 110 156 100 152 92 C142 70 122 35 100 35"
    fill="none"
    stroke="url(#cGradient)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Pagoda (centered) -->
  <g fill="#E74C3C">
    <polygon points="100,60 78,80 85,90 97,80 100,90 103,80 115,90 122,80"/>
    <polygon points="100,90 70,110 82,120 100,110 100,120 118,120 130,110"/>
    <rect x="88" y="120" width="24" height="18" rx="2" fill="#E74C3C"/>
  </g>

  <!-- Great Wall base (centered) -->
  <g fill="#6B7280">
    <path d="M68 138 L73 130 L80 135 L88 127 L96 135 L104 127 L112 135 L119 130 L124 138 Z"/>
    <rect x="65" y="138" width="70" height="12" rx="2"/>
  </g>

  <!-- Golden path (centered) -->
  <path
    d="M125 95 Q140 80 148 65"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Map pin (repositioned to upper-right within safe zone) -->
  <g transform="translate(138, 52)">
    <path d="M10 0 C10 0 18 10 18 18 C18 23 14 28 10 28 C6 28 2 23 2 18 C2 10 10 0 10 0 Z" fill="#E74C3C"/>
    <circle cx="10" cy="16" r="3.5" fill="#FFFFFF"/>
    <circle cx="10" cy="16" r="2" fill="#3A6EA5"/>
  </g>
</svg>
