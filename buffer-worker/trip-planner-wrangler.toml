# Cloudflare Worker配置 - AI Trip Planner API
# 兼容 wrangler v3

name = "trip-planner-api"
main = "trip-planner-worker.js"
compatibility_date = "2024-01-01"

# ============ 环境变量 ============
# 敏感信息通过 wrangler secret 命令设置

[vars]
# SENSENOVA_API_KEY - 通过 wrangler secret put 命令设置
# 示例：wrangler secret put SENSENOVA_API_KEY --env trip-planner-api

# ============ KV存储（调用日志） ============
# 使用与 buffer-worker 相同的 KV 命名空间

[[kv_namespaces]]
binding = "KV_STORE"
id = "a20785ef5e594755ba1d21850de25593"

# ============ 开发环境配置 ============

[env.dev]
name = "trip-planner-api-dev"

# ============ 生产环境配置 ============

[env.production]
name = "trip-planner-api"
routes = [
  { pattern = "trip-planner.chinaboundtravel.com", custom_domain = true }
]

[[env.production.kv_namespaces]]
binding = "KV_STORE"
id = "a20785ef5e594755ba1d21850de25593"

# ============ 日志配置 ============

[observability]
enabled = true
