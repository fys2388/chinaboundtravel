# Cloudflare Worker配置 - Buffer GraphQL API Auto-Poster
# 兼容 wrangler v3

name = "buffer-auto-poster"
main = "worker.js"
compatibility_date = "2024-01-01"

# ============ 环境变量 ============
# 敏感信息通过 wrangler secret 命令设置

[vars]
# 以下变量通过 wrangler secret put 命令设置
# BUFFER_TOKEN - Buffer Personal API Token
# FEISHU_WEBHOOK_URL - 飞书机器人Webhook URL
# DEEPSEEK_API_KEY - DeepSeek AI密钥（用于评论回复）

# ============ Cron定时触发器 ============
# 每30分钟执行一次评论处理

[triggers]
crons = ["*/30 * * * *"]

# ============ 开发环境配置 ============

[env.dev]
name = "buffer-auto-poster-dev"

# ============ 生产环境配置 ============

[env.production]
name = "buffer-auto-poster"
route = "https://buffer-worker.chinaboundtravel.com/*"

# ============ KV存储（预留用于评论缓存） ============
# [[kv_namespaces]]
# binding = "COMMENTS_CACHE"
# id = "YOUR_KV_NAMESPACE_ID"

# ============ 日志配置 ============

[observability]
enabled = true