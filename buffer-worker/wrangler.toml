# Cloudflare Worker配置 - Buffer GraphQL API Auto-Poster
# 兼容 wrangler v3

name = "buffer-auto-poster"
main = "worker.js"
compatibility_date = "2024-01-01"

# ============ 环境变量 ============
# 敏感信息通过 wrangler secret 命令设置

[vars]
# 以下敏感变量通过 wrangler secret put 命令设置
# BUFFER_API_TOKEN_A - Buffer账户A共享Token (FB+IG+X，发布与分析共用)
# BUFFER_API_TOKEN_B - Buffer账户B共享Token (Pinterest，发布与分析共用)
# FEISHU_WEBHOOK_URL - 飞书机器人Webhook URL
# PINTEREST_BOARD_SERVICE_ID - Pinterest画板ID

# ============ Cron定时触发器 ============
# 每日EST08:00（UTC 12:00）处理重试队列

[triggers]
# UTC 00:30 = 北京时间 08:30 触发日报
# UTC 1-18点整点 = 北京时间 9:00-次日2:00 触发热核看板刷新
# UTC 00:30 = 北京时间 08:30 触发日报
# UTC 1-18点每30分钟 = 北京时间 9:00-次日2:00 每30分钟触发热核看板
crons = ["30 0 * * *", "*/30 1-18 * * *"]

# ============ KV存储（限流计数、重试队列） ============
# 部署前需创建KV命名空间并填入id
[[kv_namespaces]]
binding = "KV_STORE"
id = "a20785ef5e594755ba1d21850de25593"

# ============ 开发环境配置 ============

[env.dev]
name = "buffer-auto-poster-dev"

# ============ 生产环境配置 ============

[env.production]
name = "buffer-auto-poster"
routes = [
  { pattern = "buffer-worker.chinaboundtravel.com", custom_domain = true }
]

# wrangler 多环境不继承顶层 kv_namespaces，需显式声明（限流/去重/重试队列依赖 KV）
[[env.production.kv_namespaces]]
binding = "KV_STORE"
id = "a20785ef5e594755ba1d21850de25593"

# ============ 日志配置 ============

[observability]
enabled = true
