# Cloudflare Worker配置 - Buffer GraphQL API Auto-Poster
# 兼容 wrangler v3

name = "buffer-auto-poster"
main = "worker.js"
compatibility_date = "2024-01-01"

# ============ 环境变量 ============
# 敏感信息通过 wrangler secret 命令设置

[vars]
# 以下变量通过 wrangler secret put 命令设置
# BUFFER_A_TOKEN - Buffer账户A Token (FB+IG+X)
# BUFFER_B_TOKEN - Buffer账户B Token (Pinterest独立)
# FEISHU_WEBHOOK - 飞书机器人Webhook URL
# PINTEREST_BOARD_SERVICE_ID - Pinterest画板ID

# ============ Cron定时触发器 ============
# 每日EST08:00（UTC 12:00）处理重试队列

[triggers]
crons = ["0 12 * * *"]

# ============ KV存储（限流计数、重试队列） ============
# 部署前需创建KV命名空间并填入id
[[kv_namespaces]]
binding = "KV_STORE"
id = "" # 需要手动填入KV命名空间ID

# ============ 开发环境配置 ============

[env.dev]
name = "buffer-auto-poster-dev"

# ============ 生产环境配置 ============

[env.production]
name = "buffer-auto-poster"
route = "https://buffer-worker.chinaboundtravel.com/*"

# ============ 日志配置 ============

[observability]
enabled = true