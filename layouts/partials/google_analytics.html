{{- if site.Params.analytics.google.TrackingID }}
<!-- Google tag (gtag.js) - standard async load with Consent Mode v2 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Consent Mode v2 - default denied until user chooses (GDPR compliant).
  // For returning visitors with saved consent, we read it inline here so
  // page_view is not held up by the cookie-consent script at end of body.
  var defaultConsent = {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'denied',
    'wait_for_update': 500
  };
  try {
    var raw = localStorage.getItem('cbt_gdpr_consent');
    if (raw) {
      var c = JSON.parse(raw);
      if (c && c.decision) {
        defaultConsent['analytics_storage'] = c.analytics ? 'granted' : 'denied';
        defaultConsent['ad_storage'] = c.marketing ? 'granted' : 'denied';
        defaultConsent['ad_user_data'] = c.marketing ? 'granted' : 'denied';
        defaultConsent['ad_personalization'] = c.marketing ? 'granted' : 'denied';
      }
    }
  } catch (e) { /* ignore */ }

  gtag('consent', 'default', defaultConsent);
  gtag('js', new Date());
  gtag('config', '{{ site.Params.analytics.google.TrackingID }}', {
    'send_page_view': true
  });
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.analytics.google.TrackingID }}"></script>
{{- end }}
