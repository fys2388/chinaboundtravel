{{- /* Post content custom area start */ -}}

{{- /* ===== Reading Progress Bar + Back to Top ===== */ -}}
<div id="reading-progress-bar" style="position:fixed;top:0;left:0;height:3px;background:#3A6EA5;z-index:9999;transition:width 0.1s linear;width:0%;"></div>
<button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:2rem;right:2rem;width:44px;height:44px;border-radius:50%;background:#3A6EA5;color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:opacity 0.3s,transform 0.3s;z-index:9998;" aria-label="Back to top" title="Back to top">&#8593;</button>
<script>
(function(){
  var bar=document.getElementById('reading-progress-bar');
  var btn=document.getElementById('back-to-top');
  if(!bar||!btn)return;
  window.addEventListener('scroll',function(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    var pct=h>0?(window.scrollY/h)*100:0;
    bar.style.width=Math.min(pct,100)+'%';
    btn.style.display=window.scrollY>600?'flex':'none';
  });
})();
</script>

{{- /* Post content custom area end */ -}}
