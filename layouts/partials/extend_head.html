{{- /* ===== Text Overlap Fixes ===== */ -}}
<style>
/* ---------------------------------------------------
   Fix 1: Homepage article card title/summary overlap
   --------------------------------------------------- */
.post-card .card-title {
    margin-bottom: 0.5rem;
    line-height: 1.4;
    overflow: hidden;
}

.post-card .card-summary {
    margin-top: 0;
    margin-bottom: 0.35rem;
    line-height: 1.6;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
}

/* Also ensure PaperMod default .entry-header h2 and .entry-content don't overlap */
.entry-header h2 {
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

.entry-content {
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

/* ---------------------------------------------------
   Fix 2: Email subscription card — ensure vertical stacking
   The subscribe-header should stack icon/heading/sub vertically
   (custom.css uses text-align:center, NOT flex).
   Prevent any inherited flex from breaking the layout.
   --------------------------------------------------- */
.subscribe-header {
    display: block !important;
    text-align: center;
    overflow: hidden;
}

.subscribe-heading {
    margin-bottom: 0.5rem;
    line-height: 1.3;
    overflow: hidden;
    font-size: 1.1rem;
    font-weight: 700;
}

.subscribe-sub {
    margin-top: 0;
    margin-bottom: 0;
    line-height: 1.4;
    overflow: hidden;
}

.subscribe-description {
    overflow: hidden;
    line-height: 1.6;
}

/* ---------------------------------------------------
   Fix 3: Footer text overlap
   The .affiliate-disclosure class has padding/border
   designed for block elements, but is used inside a
   <span> in the footer. Reset to inline-friendly styles.
   --------------------------------------------------- */
.footer .affiliate-disclosure {
    display: inline;
    padding: 0;
    border: none;
    border-left: none;
    background: none;
    font-size: inherit;
    line-height: inherit;
    margin: 0;
}

/* Ensure footer has proper line-height and wrapping */
.footer {
    line-height: 1.8;
    overflow-wrap: break-word;
    word-wrap: break-word;
}

.footer span {
    display: inline;
}

/* Force line breaks between footer sections to prevent overlap */
.footer .footer-break {
    display: block;
    content: '';
    margin: 0.4rem 0;
}

/* ---------------------------------------------------
   Fix 4: Article page subscribe card (same as Fix 2)
   Ensures subscribe card embedded in article pages
   also has proper spacing.
   --------------------------------------------------- */
.article-affiliate + .subscribe-card,
.post-content + .subscribe-card {
    margin-top: 2.5rem;
    overflow: hidden;
}

/* ---------------------------------------------------
   General safety: prevent heading text from overlapping
   following inline/block siblings across the site
   --------------------------------------------------- */
h1, h2, h3, h4, h5, h6 {
    overflow: hidden;
}

.post-entry {
    overflow: hidden;
}

/* ---------------------------------------------------
   Fix 6: Featured image aspect ratio
   Ensure cover images maintain proper proportions
   --------------------------------------------------- */
.entry-cover {
    margin: 1.5rem 0;
    overflow: hidden;
    border-radius: 8px;
}

.entry-cover img {
    width: 100%;
    height: auto;
    object-fit: cover;
    display: block;
}

/* Article body images */
.post-content img {
    border-radius: 8px;
    max-width: 100%;
    height: auto;
}

/* Accessibility: visually hide labels but keep for screen readers */
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* Fix 7: Mobile — prevent horizontal scroll from logo/nav overflow */
.header-nav {
    max-width: 100%;
    overflow: hidden;
}
.logo {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.logo a {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
}
.menu {
    flex-wrap: wrap;
}

/* Prevent any element from causing horizontal scroll */
html, body {
    overflow-x: hidden;
    max-width: 100vw;
}
img, table, pre, video, iframe {
    max-width: 100% !important;
}
</style>
