{{- /* Head custom content area start */ -}}
{{- /* Google Analytics is loaded via google_analytics.html partial */ -}}

{{- /* Emerald Tracker */ -}}
<script data-noptimize="1" data-cfasync="false">
  (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.src = 'https://emrldtp.com/NTMxNDY5.js?t=531469';
      document.head.appendChild(script);
  })();
</script>

{{- /* Schema Structured Data */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {{- /* BreadcrumbList */ -}}
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "{{ .Site.Title }}",
          "item": "{{ .Site.BaseURL }}"
        }
        {{- if .IsPage }}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": "{{ .Section | humanize }}",
          "item": "{{ .Site.BaseURL }}{{ .Section }}"
        }
        ,{
          "@type": "ListItem",
          "position": 3,
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
        {{- else if .IsSection }}
        ,{
          "@type": "ListItem",
          "position": 2,
          "name": "{{ .Title }}",
          "item": "{{ .Permalink }}"
        }
        {{- end }}
      ]
    }
    {{- if .IsPage -}}
    ,{
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "headline": "{{ .Title }}",
      "description": "{{ .Description | default .Summary }}",
      "author": {
        "@type": "Person",
        "name": "{{ .Site.Author.name | default .Site.Params.author }}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{ .Site.Title }}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ .Site.BaseURL }}favicon.ico"
        }
      },
      "datePublished": "{{ .Date.Format "2006-01-02" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
      "image": "{{ if (and .Params.cover (isset .Params.cover "image")) }}{{ .Params.cover.image }}{{ else if .Params.cover }}{{ if not (reflect.IsSlice .Params.cover) }}{{ if not (eq (printf "%T" .Params.cover) "string") }}{{ .Params.cover.image | default .Site.BaseURL }}{{ else }}{{ .Params.cover }}{{ end }}{{ else }}{{ .Params.cover | default .Site.BaseURL }}{{ end }}{{ else }}{{ .Site.BaseURL }}images/default.jpg{{ end }}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      }
    }
    {{- end -}}
  ]
}
</script>
{{- /* Head custom content area end */ -}}
