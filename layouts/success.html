{{ define "main" }}
<style>
    .success-container {
        max-width: 600px;
        margin: 4rem auto;
        padding: 2rem;
        text-align: center;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .success-container h2 {
        font-size: 1.8rem;
        color: #1a1a2e;
        margin-bottom: 1rem;
    }
    .success-container p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 1.5rem;
    }
    .success-actions, .cancel-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
    }
    .btn-primary, .btn-secondary {
        padding: 0.8rem 2rem;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s ease;
        display: inline-block;
    }
    .btn-primary {
        background: linear-gradient(135deg, #FF6B35, #e55a25);
        color: #fff;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }
    .btn-secondary {
        background: #f0f5fa;
        color: #3A6EA5;
        border: 2px solid #3A6EA5;
    }
    .btn-secondary:hover {
        background: #3A6EA5;
        color: #fff;
    }
    .success-note, .cancel-note {
        font-size: 0.85rem;
        color: #888;
    }
    .success-note a, .cancel-note a {
        color: #FF6B35;
        text-decoration: none;
    }
</style>

<div class="success-container">
    {{ .Content }}
</div>
{{
