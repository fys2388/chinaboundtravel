# Sitemap optimized: tag pages excluded from sitemap via custom template
baseURL = 'https://www.chinaboundtravel.com/'
languageCode = 'en-us'
title = 'ChinaBound Travel | China Travel Guide 2026 — Visa, Payment & Internet for Foreigners'
theme = 'PaperMod'
defaultContentLanguage = 'en'
enableInlineShortcodes = true
disableHugoGeneratorInject = true
enableRobotsTXT = true

buildDrafts = false
buildFuture = true  # 支持提前写好并定时发布未来日期的文章（如明天的博文）
buildExpired = false
ignoreFiles = ["/\\.archived/"]

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = 'ChinaBound Travel | China Travel Guide 2026 — Visa, Payment & Internet for Foreigners'
  description = 'Practical travel guide for foreigners visiting China. Visa updates, Alipay & WeChat Pay setup, eSIM & VPN, high-speed trains, and city guides. Brought to you by the ChinaBound Travel editorial team.'
  author = 'Joran'
  images = ["/images/og-default.jpg"]

  rss = true

  sitemapExclude = ["_draft", "member-month", "member-year", "cancel", "success", "search", "static-package", "tags", "ebook", "posts/2026-05-26-is-china-safe-for-tourists-2026-honest-assessment", "posts/2026-05-27-how-to-survive-chinese-train-station", "posts/transportation-guide", "posts/foodies-guide-to-china-a-gastronomic-adventure", "posts/travel-safety-guide", "posts/navigating-china-with-confidence-a-californians-guide-to-travel-safety", "posts/navigating-chinas-transportation-a-californians-guide-for-european-travelers", "posts/a-gastronomic-adventure-in-china-food-recommendations-for-international-travelers", "posts/navigating-chinas-accommodation-maze-a-californians-guide-for-aussie-and-kiwi-travelers", "posts/a-gastronomic-adventure-in-china-a-foodies-guide-for-european-travelers"]

  [params.search]
    enable = true
    type = "fuse"
    showMeta = true
    showDescription = true
    placeholder = "Search for visa, payment, trains, or pandas..."

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Joran"
    subtitle = "Research-based China travel guidance for international visitors — visas, payments, internet, transportation and cities, kept current for 2026."
    imageUrl = "images/joran-avatar.webp"
    imageWidth = 120
    imageHeight = 120

  [params.label]
    icon = "images/favicon/favicon.svg"
    iconHeight = 32

  [[params.socialIcons]]
    name = "X"
    url = "https://twitter.com/chinaboundtravel"
  [[params.socialIcons]]
    name = "Pinterest"
    url = "https://pinterest.com/chinaboundtravel"
  [[params.socialIcons]]
    name = "Youtube"
    url = "https://youtube.com/@chinaboundtravel"
  [[params.socialIcons]]
    name = "Email"
    url = "mailto:hello@chinaboundtravel.com"

  mainMenu = "main"
  showMeta = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  comments = true

