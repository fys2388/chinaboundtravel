# Sitemap optimized: tag pages excluded from sitemap via custom template
# Deploy note: hugo.toml is in deploy-trigger paths; keep it touched to force deploys.
# 2026-08-27: re-run deploy to apply CLOUDFLARE_EMAIL secret (Cache Rule auth fix).
baseURL = 'https://www.chinaboundtravel.com/'
languageCode = 'en-us'
title = 'ChinaBound Travel | China Travel Guide 2026 — Visa, Payment & Internet for Foreigners'
theme = 'PaperMod'
defaultContentLanguage = 'en'
enableInlineShortcodes = true
disableHugoGeneratorInject = true
enableRobotsTXT = true

buildDrafts = false
buildFuture = true  # 支持提前写好并定时发布未来日期的文章（如明天的博文）
buildExpired = false
ignoreFiles = ["/\\.archived/"]

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = 'ChinaBound Travel | China Travel Guide 2026 — Visa, Payment & Internet for Foreigners'
  description = 'Practical travel guide for foreigners visiting China. Visa updates, Alipay & WeChat Pay setup, eSIM & VPN, high-speed trains, and city guides. Brought to you by the ChinaBound Travel editorial team.'
  author = 'Joran'
  images = ["/images/og-default.jpg"]

  rss = true

  sitemapExclude = ["_draft", "member-month", "member-year", "cancel", "success", "search", "static-package", "tags", "ebook", "posts/2026-05-26-is-china-safe-for-tourists-2026-honest-assessment", "posts/2026-05-27-how-to-survive-chinese-train-station", "posts/transportation-guide", "posts/foodies-guide-to-china-a-gastronomic-adventure", "posts/travel-safety-guide", "posts/navigating-china-with-confidence-a-californians-guide-to-travel-safety", "posts/navigating-chinas-transportation-a-californians-guide-for-european-travelers", "posts/a-gastronomic-adventure-in-china-food-recommendations-for-international-travelers", "posts/navigating-chinas-accommodation-maze-a-californians-guide-for-aussie-and-kiwi-travelers", "posts/a-gastronomic-adventure-in-china-a-foodies-guide-for-european-travelers"]

  [params.search]
    enable = true
    type = "fuse"
    showMeta = true
    showDescription = true
    placeholder = "Search for visa, payment, trains, or pandas..."

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Joran"
    subtitle = "Research-based China travel guidance for international visitors — visas, payments, internet, transportation and cities, kept current for 2026."
    imageUrl = "images/favicon/favicon.svg"
    imageWidth = 120
    imageHeight = 120

  [params.label]
    icon = "images/favicon/favicon.svg"
    iconHeight = 32

  [[params.socialIcons]]
    name = "X"
    url = "https://twitter.com/chinaboundtravel"
  [[params.socialIcons]]
    name = "Pinterest"
    url = "https://pinterest.com/chinaboundtravel"
  [[params.socialIcons]]
    name = "Youtube"
    url = "https://youtube.com/@chinaboundtravel"
  [[params.socialIcons]]
    name = "Email"
    url = "mailto:joran@chinaboundtravel.com"

  mainMenu = "main"
  showMeta = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  comments = true

[[menu.main]]
  identifier = "home"
  name = "🏡 Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "cities"
  name = "🏙️ City Travel"
  url = "/cities/"
  weight = 20

[[menu.main]]
  identifier = "essentials"
  name = "🧳 Essentials"
  url = "/resources/"
  weight = 30

[[menu.main]]
  identifier = "visa"
  name = "🛂 Visa"
  url = "/visa/"
  weight = 31
  parent = "essentials"

[[menu.main]]
  identifier = "payments"
  name = "💳 Payment"
  url = "/payments/"
  weight = 32
  parent = "essentials"

[[menu.main]]
  identifier = "internet"
  name = "📡 Internet"
  url = "/internet/"
  weight = 33
  parent = "essentials"

[[menu.main]]
  identifier = "posts"
  name = "📝 Blog"
  url = "/posts/"
  weight = 40

[[menu.main]]
  identifier = "resources"
  name = "🧰 Resources"
  url = "/resources/"
  weight = 50

[[menu.main]]
  identifier = "pricing"
  name = "💰 Pricing"
  url = "/pricing/"
  weight = 60

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 70

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = false
  minifyOutput = true

[imaging]
  quality = 75
  anchor = "smart"

[params.analytics]
  google = { SiteVerificationTag = "", TrackingID = "G-GECBME3YVJ" }
  # GSC 验证码: 在 https://search.google.com/search-console → 设置 → 验证所有权 → HTML 标签
  # 将 content 值填入 SiteVerificationTag，例如: "abcdef1234567890"
  googleSearchConsole = "google-site-verification=YOUR_VERIFICATION_CODE"
  bing = { SiteVerificationTag = "" }

[params.affiliate]
  # ── 联盟链接 tracking 覆盖状态（2026-09-21 复核 + 补文档）─────────────
  # 带 tracking 的才会产生归因佣金；不带的 = 流量白送、佣金恒 0。
  #
  # 28 天 affiliate 数据实况（Ops Dashboard）：
  #   Clicks 81 · Inits 0 · Bookings 0 · Revenue $0
  #
  # ⚠️ 2026-09-21 更正：Revenue $0 的原因不是 tracking 缺口。
  # scripts/affiliate_link_audit.py 当前结论：211 条链接全部带 tracking、
  # 0 个未跟踪 key、0 处裸联盟链接。当天已修掉 4 处裸 airalo.com——Airalo 的
  # App 内购买不计佣金，裸链到品牌站等于把可归因路径漏成不可归因。
  # 剩余 7 处裸链指向 trip.com / worldnomads / allianz：这三个计划未获批准，
  # 裸链是正确编辑行为，不存在「漏 tracking」，已列入 NON_AFFILIATE_HOSTS。
  #
  # 真实的 $0 阻塞项（按依赖顺序，前三项都不是改代码能解决的）：
  #   1. Travelpayouts 未配置提现方式（余额 $0）→ 商务动作，agent 无法代办
  #   2. Impact / Partnerize / multi_partner 归因数据源 NO_CREDENTIALS →
  #      学习 agent 读不到任何联盟结果，在拿噪声学习
  #   3. affiliate_clicks < 20，未达样本阈值 → 无统计依据做 CTA 优化
  #   4. 流量才是瓶颈：GSC 28 天 421 曝光 / ~4 点击 / 平均排名 71 位
  #      （Google 第 8 页）；Organic Search 仅占全站 sessions 的 4.7%
  # 另注：GA4 流量榜第一大页是 /ops-dashboard/（173 pv），超过首页（98 pv），
  # 内部流量正在污染所有漏斗样本，需配置 GA4 内部流量排除。
  # 详见 reports/revenue/ 与 reports/real_data/。
  #
  # 【覆盖状态表：2026-09-21 清理后】
  #   ✅ TRACKED  hotel · flight · klook · safetywing · vpn · vpnNord · esim
  #              esim 2026-09-21 补齐：Travelpayouts 程序 541（12% 佣金 / 30 天 cookie）
  #   🗑 REMOVED  trip · worldnomads · allianz · nordpass
  #              2026-09-21 清理：均未通过联盟准入或从未申请，config 不再保留假覆盖。
  #              Trip.com 需连续 3 个月稳定月流量后提交审核；World Nomads 走 Impact 被拒；
  #              Allianz 无公开 affiliate 计划；NordPass 0 处引用。
  #              对应 shortcode（ab-cta / affiliate-link / affiliate-mid-cta）已改为
  #              URL 缺失时渲染纯文本/虚线标签，不产生死链接。
  #              2026-09-21 收尾：残留的 3 处 trip shortcode cell 已改为普通编辑链接
  #              —— Trip.com 的推荐本身成立，只是不在联盟计划内，不应伪装成 affiliate。
  #
  # ⛔ GAP 类全部无法通过改代码修复：tracking 参数（referral code / affiliate ID /
  # token）需要向对应平台注册联盟计划、人工申请后才能拿到。改代码只能改文案或
  # 把推荐对象换成已入驻的平台，但会牺牲读者推荐与需求的匹配度（例如 World Nomads
  # 是"极限运动/高风险运动"场景的唯一合适推荐，换成 SafetyWing 语义不符）。
  #
  # 【2026-09-18 补充：Travelpayouts 能覆盖什么，不能覆盖什么】
  #   ✅ 已入驻且带 tracking（marker=730795）：
  #        hotel   = booking.com?aid=730795      （酒店）
  #        flight  = aviasales.com?marker=730795 （机票，含中国国内航线）
  #        klook   = klook.tpo.li/vrPkmS2v       （当地体验/门票，2027-07-24 到期需续）
  #        safetywing = referenceID=26548976      （旅行保险）
  #        vpn     = get.affiliatescn.net aff_id=150687（NordVPN）
  #   ❌ Travelpayouts 覆盖不到（2026-09-21 已从 config 移除，不再保留假覆盖）：
  #        （2026-09-21 更正：原判定"eSIM 不在 Travelpayouts 网络内"是错的。
  #         实测 Airalo=程序 541 / Yesim=224 / GigSky=636 三个 eSIM 程序均已入驻可生成链接）
  #        trip    = Trip.com（程序 121）在本站点**未开通**：后台显示
  #                  "25 programs are currently unavailable for Chinaboundtravel /
  #                  Your website doesn't currently have enough traffic. Submit for
  #                  review once it has stable monthly traffic for at least three
  #                  consecutive months." 是程序准入未通过，不是 token 格式问题。
  #                  恢复步骤：月流量稳定满 3 个月后，在 Trip.com 程序页点
  #                  "Submit for review"，通过后再到 Links 生成 deep-link token。
  #        worldnomads / allianz = 保险类，Travelpayouts 无对应产品（World Nomads 走
  #                  Impact 被拒，Allianz 无公开 affiliate 计划），key 已移除。
  esim = "https://airalo.tpo.li/39yPity6"                    # ✅ TRACKED 2026-09-21：渲染 156 处，全站最大联盟面。
                                                      # Travelpayouts 程序 541（Airalo），12% 佣金 / 30 天 cookie。
                                                      # 短链 302 → airalo.pxf.io（CJ Affiliate），sharedID=730795 已烧入，
                                                      # 跳转链实测验证通过（2026-09-21 06:29 UTC+8 生成）。
                                                      #
                                                      # 修复历史：历史上是 https://www.airalo.com/promo/38j3e4（带 ref 码），
                                                      # 该链接 404 后被 2026-09 的一次“修复”替换成裸 URL——归属随之丢失
                                                      # （见 reports/browser_ui_affiliate_check_report.md 问题 1）。
                                                      # 原判定“eSIM 不在 Travelpayouts 覆盖范围内”是错的：Airalo 作为
                                                      # 程序 541 一直已入驻，只是没去后台生成短链。
                                                      #
                                                      # 注意：App 内购买不计佣金（仅桌面 + 移动网页），自己购买不计。
                                                      # eSIM 备选：Yesim（程序 224，18% / 90 天 cookie）、
                                                      # GigSky（程序 636，20% / 30 天）。换品牌需同步调整内容推荐语。
  vpn = "https://get.affiliatescn.net/aff_c?offer_id=153&aff_id=150687&url_id=613"
  vpnNord = "https://get.affiliatescn.net/aff_c?offer_id=153&aff_id=150687&url_id=613"
  hotel = "https://www.booking.com/index.html?aid=730795"
  klook = "https://klook.tpo.li/vrPkmS2v"             # ✅ Travelpayouts 短链，2027-07-24 到期需续
  klook_expire_date = "2027-07-24"
  safetywing = "https://safetywing.com/nomad-insurance?referenceID=26548976&utm_source=26548976&utm_medium=Ambassador"
  flight = "https://www.aviasales.com/?marker=730795"
  partnerizeUserId = "10111425644"

